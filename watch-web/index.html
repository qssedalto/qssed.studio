<!doctype html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>AERTEX Watch</title>
  <link rel="icon" href="/favicon.svg?v=aertex-20261003-product-badge-11" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/appearance.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a id="backHome" class="brand" href="#">AERTEX</a>
    <div class="product">Watch</div>
    <div class="spacer"></div>
    <button id="refreshButton" class="quiet" type="button">刷新</button>
  </header>
  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">AERTEX Watch</p>
        <h1>电脑上的 ActivityWatch，手机也能看。</h1>
        <p class="lead">连接电脑后，ActivityWatch 的记录会同步到这里。</p>
        <a class="hero-guide-link" href="https://qsseda.com/zh-cn/aw/setup">想在自己的手机上查看这台电脑的使用记录？查看设置教程</a>
      </div>
      <div class="sync-state">
        <span id="syncDot" class="dot"></span>
        <div><strong id="syncLabel">正在检查同步状态…</strong><small id="syncDetail"></small></div>
      </div>
    </section>

    <section class="kpis">
      <article><span>今日活动</span><strong id="todayDuration">—</strong><small>已记录的活动时间</small></article>
      <article><span>数据源</span><strong id="bucketCount">—</strong><small>来自 ActivityWatch</small></article>
      <article><span>最近同步</span><strong id="lastSync">—</strong><small id="lastSyncHost">尚未连接</small></article>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><div><p class="eyebrow">今天</p><h2>应用使用</h2></div></div>
        <div id="apps" class="apps"><p class="muted">正在加载…</p></div>
      </article>

      <article class="panel">
        <div class="panel-head"><div><p class="eyebrow">同步</p><h2>连接电脑</h2></div></div>
        <p class="muted">在电脑上运行 AERTEX Watch Sync，并使用这里生成的设备令牌。连接后，新记录会自动同步。</p>
        <div class="actions"><button id="createToken" type="button">生成设备令牌</button></div>
        <div id="tokenBox" class="token-box" hidden>
          <label>设备令牌（仅显示一次）</label>
          <code id="tokenValue"></code>
          <button id="copyToken" class="quiet" type="button">复制</button>
        </div>
        <p class="hint">这个令牌只用于连接你的电脑。</p>
      </article>
    </section>

    <section class="panel buckets-panel">
      <div class="panel-head"><div><p class="eyebrow">ActivityWatch</p><h2>已连接的数据源</h2></div></div>
      <div id="buckets" class="bucket-list"><p class="muted">正在加载…</p></div>
    </section>
  </main>
</body>
</html>
