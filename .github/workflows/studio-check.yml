name: Studio Worker Check

on:
  pull_request:
    paths:
      - "worker.js"
      - "admin-worker.js"
      - "admin/**"
      - "studio/**"
      - "tex-vendor/**"
      - "supabase/migrations/**"
      - "local-bridge/**"

      - "ReadMe.md"
      - "docs/BEGINNER_CODE_GUIDE_CN.md"
      - "scripts/beginner-guide-check.mjs"
      - "scripts/security-markup-check.mjs"
      - "scripts/signup-completion-check.mjs"
      - "scripts/security-architecture-check.mjs"
      - "scripts/edge-protection-check.mjs"
      - "scripts/wallpaper-download-check.mjs"
      - "scripts/public-index-runtime-check.mjs"
      - "scripts/public-questions-check.mjs"
      - "scripts/global-search-check.mjs"
      - "scripts/projects-check.mjs"
      - "scripts/tasks-check.mjs"
      - "scripts/drafts-check.mjs"
      - "scripts/workbench-check.mjs"
      - "scripts/native-mobile-services-check.mjs"
      - "scripts/native-work-cash-check.mjs"
      - "scripts/native-intelligence-chat-check.mjs"
      - "scripts/lab-check.mjs"
      - "scripts/tex-workbench-check.mjs"
      - "scripts/tex-toolbar-scroll-check.mjs"
      - "scripts/tex-tree-selection-check.mjs"
      - "scripts/tex-explorer-check.mjs"
      - "scripts/tex-file-manager-check.mjs"
      - "scripts/tex-github-compile-project-check.mjs"
      - "scripts/tex-toolbar-actions-check.mjs"
      - "scripts/tex-pdf-auto-theme-check.mjs"
      - "scripts/work-local-bridge-check.mjs"
      - "scripts/work-subdomain-check.mjs"
      - "scripts/gpt-subdomain-check.mjs"
      - "scripts/gpt-ui-check.mjs"
      - "scripts/appearance-check.mjs"
      - "scripts/admin-control-plane-check.mjs"
      - "scripts/account-menu-check.mjs"
      - "scripts/codex-bridge-check.mjs"
      - "scripts/brand-check.mjs"
      - "scripts/swei-font-check.mjs"
      - "scripts/favicon-check.mjs"
      - "scripts/r2-storage-audit-check.mjs"
      - "scripts/billing-subscription-check.mjs"
      - "scripts/wishes-check.mjs"
      - "wrangler.jsonc"
      - "wrangler.work.jsonc"
      - "gpt-worker.js"
      - "wrangler.gpt.jsonc"
      - "cash-worker.js"
      - "cash-web/**"
      - "studio/cash-subdomain.js"
      - "scripts/cash-subdomain-check.mjs"
      - "scripts/cash-model-check.mjs"
      - "wrangler.cash.jsonc"
      - "watch-worker.js"
      - "watch-web/**"
      - "AW-Sync/**"
      - "studio/watch-subdomain.js"
      - "scripts/watch-cloud-check.mjs"
      - "wrangler.watch.jsonc"
      - "wrangler.admin.jsonc"
      - ".github/workflows/studio-check.yml"
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "admin-worker.js"
      - "admin/**"
      - "studio/**"
      - "supabase/migrations/**"
      - "local-bridge/**"

      - "ReadMe.md"
      - "docs/BEGINNER_CODE_GUIDE_CN.md"
      - "scripts/beginner-guide-check.mjs"
      - "scripts/security-markup-check.mjs"
      - "scripts/signup-completion-check.mjs"
      - "scripts/security-architecture-check.mjs"
      - "scripts/edge-protection-check.mjs"
      - "scripts/wallpaper-download-check.mjs"
      - "scripts/global-search-check.mjs"
      - "scripts/projects-check.mjs"
      - "scripts/tasks-check.mjs"
      - "scripts/drafts-check.mjs"
      - "scripts/workbench-check.mjs"
      - "scripts/native-mobile-services-check.mjs"
      - "scripts/native-work-cash-check.mjs"
      - "scripts/native-intelligence-chat-check.mjs"
      - "scripts/lab-check.mjs"
      - "scripts/tex-workbench-check.mjs"
      - "scripts/tex-toolbar-scroll-check.mjs"
      - "scripts/tex-tree-selection-check.mjs"
      - "scripts/tex-explorer-check.mjs"
      - "scripts/tex-file-manager-check.mjs"
      - "scripts/tex-github-compile-project-check.mjs"
      - "scripts/tex-toolbar-actions-check.mjs"
      - "scripts/tex-pdf-auto-theme-check.mjs"
      - "scripts/work-local-bridge-check.mjs"
      - "scripts/work-subdomain-check.mjs"
      - "scripts/gpt-subdomain-check.mjs"
      - "scripts/gpt-ui-check.mjs"
      - "scripts/appearance-check.mjs"
      - "scripts/admin-control-plane-check.mjs"
      - "scripts/account-menu-check.mjs"
      - "scripts/codex-bridge-check.mjs"
      - "scripts/brand-check.mjs"
      - "scripts/swei-font-check.mjs"
      - "scripts/r2-storage-audit-check.mjs"
      - "scripts/billing-subscription-check.mjs"
      - "scripts/wishes-check.mjs"
      - "wrangler.jsonc"
      - "wrangler.work.jsonc"
      - "gpt-worker.js"
      - "wrangler.gpt.jsonc"
      - "cash-worker.js"
      - "cash-web/**"
      - "studio/cash-subdomain.js"
      - "scripts/cash-subdomain-check.mjs"
      - "wrangler.cash.jsonc"
      # push 到 main 时也要覆盖 Watch；此前这些路径只存在于 pull_request 过滤器，
      # 导致 Watch-only merge 后 Studio Worker Check 不会再次运行。
      - "watch-worker.js"
      - "watch-web/**"
      - "AW-Sync/**"
      - "studio/watch-subdomain.js"
      - "scripts/watch-cloud-check.mjs"
      - "wrangler.watch.jsonc"
      - "wrangler.admin.jsonc"
      - ".github/workflows/studio-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Build self-hosted TeX browser modules
        run: |
          npm install --prefix tex-vendor --no-audit --no-fund
          node tex-vendor/build.mjs
          node scripts/tex-vendor-check.mjs

      - name: Check Studio JavaScript syntax
        run: |
          node --check worker.js
          node --check admin-worker.js
          for file in admin/*.js; do node --check "$file"; done
          for file in studio/*.js; do node --check "$file"; done
          node --check local-bridge/server.mjs
          node --check local-bridge/codex-server.mjs

          node --check scripts/security-markup-check.mjs
          node --check scripts/signup-completion-check.mjs
          node --check scripts/beginner-guide-check.mjs
          node --check scripts/security-architecture-check.mjs
          node --check scripts/edge-protection-check.mjs
          node --check scripts/wallpaper-download-check.mjs
          node --check scripts/public-index-runtime-check.mjs
          node --check scripts/public-questions-check.mjs
          node --check scripts/global-search-check.mjs
          node --check scripts/projects-check.mjs
          node --check scripts/tasks-check.mjs
          node --check scripts/drafts-check.mjs
          node --check scripts/workbench-check.mjs
          node --check scripts/native-mobile-services-check.mjs
          node scripts/native-mobile-services-check.mjs
          node --check scripts/native-work-cash-check.mjs
          node scripts/native-work-cash-check.mjs
          node --check scripts/native-intelligence-chat-check.mjs
          node scripts/native-intelligence-chat-check.mjs
          node --check scripts/lab-check.mjs
          node --check scripts/tex-workbench-check.mjs
          node --check scripts/tex-toolbar-scroll-check.mjs
          node --check scripts/tex-tree-selection-check.mjs
          node --check scripts/tex-explorer-check.mjs
          node --check scripts/tex-file-manager-check.mjs
          node --check scripts/tex-github-compile-project-check.mjs
          node --check scripts/tex-toolbar-actions-check.mjs
          node --check scripts/tex-pdf-auto-theme-check.mjs
          node --check scripts/work-local-bridge-check.mjs
          node --check scripts/work-subdomain-check.mjs
          node --check scripts/gpt-subdomain-check.mjs
          node --check scripts/gpt-ui-check.mjs
          node --check scripts/appearance-check.mjs
          node --check scripts/admin-control-plane-check.mjs
          node --check scripts/account-menu-check.mjs
          node --check scripts/codex-bridge-check.mjs
          node --check scripts/brand-check.mjs
          node --check scripts/swei-font-check.mjs
          node --check scripts/favicon-check.mjs
          node --check scripts/r2-storage-audit-check.mjs
          node --check scripts/billing-subscription-check.mjs
          node --check scripts/wishes-check.mjs
          node --check gpt-worker.js
          node --check cash-worker.js
          node --check cash-web/model.js
          node --check cash-web/app.js
          node --check scripts/cash-subdomain-check.mjs
          node --check scripts/cash-model-check.mjs
          node --check watch-worker.js
          node --check watch-web/app.js
          node --check watch-web/aw-sync.mjs
          node --check AW-Sync/native/aw-sync.mjs
          node --check scripts/watch-cloud-check.mjs

      - name: Verify Chinese beginner guide and source references
        run: node scripts/beginner-guide-check.mjs

      - name: Verify browser security markup
        run: node scripts/security-markup-check.mjs

      - name: Verify registration single submission and completion
        run: node scripts/signup-completion-check.mjs

      - name: Verify Studio API routing architecture
        run: node scripts/security-architecture-check.mjs

      - name: Verify edge anti-crawl and surge protection
        run: |
          node scripts/edge-protection-check.mjs
          node scripts/wallpaper-download-check.mjs

      - name: Verify public index route runtime
        run: node scripts/public-index-runtime-check.mjs

      - name: Verify public Questions knowledge base
        run: node scripts/public-questions-check.mjs

      - name: Verify global search workspace
        run: node scripts/global-search-check.mjs

      - name: Verify project workspace
        run: node scripts/projects-check.mjs

      - name: Verify task center
        run: node scripts/tasks-check.mjs

      - name: Verify draft workspace
        run: node scripts/drafts-check.mjs

      - name: Verify Workbench aggregation
        run: node scripts/workbench-check.mjs

      - name: Verify Lab registry
        run: node scripts/lab-check.mjs

      - name: Verify TeX Workbench
        run: |
          node scripts/tex-workbench-check.mjs
          node scripts/tex-toolbar-scroll-check.mjs
          node scripts/tex-tree-selection-check.mjs
          node scripts/tex-live-collaboration-check.mjs
          node scripts/tex-link-sharing-check.mjs
          node scripts/tex-toolbar-actions-check.mjs
          node scripts/tex-file-manager-check.mjs
          node scripts/tex-explorer-check.mjs
          node scripts/tex-github-compile-project-check.mjs

      - name: Verify TeX add-file workflows and authorization
        run: node scripts/tex-file-manager-check.mjs

      - name: Verify site-synced PDF colors and preserved images
        run: node scripts/tex-pdf-auto-theme-check.mjs

      - name: Verify Work local bridge pilot
        run: node scripts/work-local-bridge-check.mjs

      - name: Verify Work custom domain
        run: node scripts/work-subdomain-check.mjs

      - name: Verify GPT authentication handoff
        run: node scripts/gpt-subdomain-check.mjs

      - name: Verify GPT rendered UI
        run: node scripts/gpt-ui-check.mjs

      - name: Verify shared appearance runtime
        run: node scripts/appearance-check.mjs

      - name: Verify Cash custom domain and editable model
        run: |
          node scripts/cash-subdomain-check.mjs
          node scripts/cash-model-check.mjs

      # 这里是静态架构 + VM 算法回归；不会访问生产用户数据。
      - name: Verify AERTEX Watch cloud architecture
        run: node scripts/watch-cloud-check.mjs

      - name: Verify isolated admin control plane
        run: node scripts/admin-control-plane-check.mjs

      - name: Verify shared account menu
        run: node scripts/account-menu-check.mjs

      - name: Verify Codex local provider
        run: node scripts/codex-bridge-check.mjs

      - name: Verify AERTEX product naming
        run: node scripts/brand-check.mjs

      - name: Check Chinese-only Swei Halfmoon typography
        run: node scripts/swei-font-check.mjs

      - name: Verify shared AERTEX brand assets
        run: node scripts/favicon-check.mjs

      - name: Verify R2 storage and access-audit optimization
        run: node scripts/r2-storage-audit-check.mjs

      - name: Verify subscription and entitlement foundation
        run: node scripts/billing-subscription-check.mjs

      - name: Verify wish link builder and short routes
        run: node scripts/wishes-check.mjs
      - name: Verify impossible sign-up parody
        run: node scripts/odd-signup-check.mjs


      - name: Bundle Studio Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-studio-check

      - name: Bundle Work Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.work.jsonc --dry-run --outdir .wrangler-work-check

      - name: Bundle GPT Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.gpt.jsonc --dry-run --outdir .wrangler-gpt-check

      - name: Bundle Cash Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.cash.jsonc --dry-run --outdir .wrangler-cash-check

      - name: Bundle Watch Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.watch.jsonc --dry-run --outdir .wrangler-watch-check

      - name: Bundle Admin Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.admin.jsonc --dry-run --outdir .wrangler-admin-check

      - name: Validate Studio Wrangler JSONC shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc', 'utf8')
            .replace(/^\s*\/\/.*$/gm, '')
            .replace(/\/\*[\s\S]*?\*\//g, '');
          const config = JSON.parse(text);
          const auditedFacade = fs.readFileSync('studio/worker-audit.js', 'utf8');
          if (config.main !== 'studio/worker-audit.js') throw new Error('wrangler.jsonc must enter through the audited Studio facade');
          if (!auditedFacade.includes('import worker from "../worker.js"')) throw new Error('Studio audit facade must reuse the hardened worker.js compatibility facade');
          if (!auditedFacade.includes('recordAccessAudit')) throw new Error('Studio audit facade must preserve access auditing');
          const expectedWildcardRoutes = new Map([
            ['qsseda.com/*', 'qsseda.com'],
            ['*.qsseda.com/*', 'qsseda.com'],
            ['qsseda.studio/*', 'qsseda.studio'],
            ['*.qsseda.studio/*', 'qsseda.studio']
          ]);
          for (const route of config.routes || []) {
            if (expectedWildcardRoutes.get(route.pattern) === route.zone_name) expectedWildcardRoutes.delete(route.pattern);
          }
          if (expectedWildcardRoutes.size) throw new Error('Missing wildcard Worker routes: ' + [...expectedWildcardRoutes.keys()].join(', '));
          if (!Array.isArray(config.r2_buckets) || !config.r2_buckets.some(b => b.binding === 'STORAGE' && b.bucket_name === 'qsseda-studio-storage')) throw new Error('Studio STORAGE R2 binding is missing');
          const limiterNames = new Set((config.ratelimits || []).map(item => item.name));
          for (const required of ['AUTH_RATE_LIMITER','API_READ_RATE_LIMITER','API_WRITE_RATE_LIMITER','EDGE_GLOBAL_RATE_LIMITER','EDGE_ANON_RATE_LIMITER','EDGE_SUSPECT_RATE_LIMITER','EDGE_EXPENSIVE_RATE_LIMITER']) if (!limiterNames.has(required)) throw new Error(`Missing rate limiter binding: ${required}`);
          console.log('Studio Wrangler configuration looks valid.');
          NODE
