name: Studio Worker Check

on:
  pull_request:
    paths:
      - "worker.js"
      - "studio/**"
      - "local-bridge/**"
      - "scripts/security-markup-check.mjs"
      - "scripts/security-architecture-check.mjs"
      - "scripts/edge-protection-check.mjs"
      - "scripts/global-search-check.mjs"
      - "scripts/projects-check.mjs"
      - "scripts/tasks-check.mjs"
      - "scripts/drafts-check.mjs"
      - "scripts/workbench-check.mjs"
      - "scripts/lab-check.mjs"
      - "scripts/tex-workbench-check.mjs"
      - "scripts/work-local-bridge-check.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/studio-check.yml"
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "studio/**"
      - "local-bridge/**"
      - "scripts/security-markup-check.mjs"
      - "scripts/security-architecture-check.mjs"
      - "scripts/edge-protection-check.mjs"
      - "scripts/global-search-check.mjs"
      - "scripts/projects-check.mjs"
      - "scripts/tasks-check.mjs"
      - "scripts/drafts-check.mjs"
      - "scripts/workbench-check.mjs"
      - "scripts/lab-check.mjs"
      - "scripts/tex-workbench-check.mjs"
      - "scripts/work-local-bridge-check.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/studio-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Studio JavaScript syntax
        run: |
          node --check worker.js
          for file in studio/*.js; do node --check "$file"; done
          node --check local-bridge/server.mjs
          node --check scripts/security-markup-check.mjs
          node --check scripts/security-architecture-check.mjs
          node --check scripts/edge-protection-check.mjs
          node --check scripts/global-search-check.mjs
          node --check scripts/projects-check.mjs
          node --check scripts/tasks-check.mjs
          node --check scripts/drafts-check.mjs
          node --check scripts/workbench-check.mjs
          node --check scripts/lab-check.mjs
          node --check scripts/tex-workbench-check.mjs
          node --check scripts/work-local-bridge-check.mjs

      - name: Verify browser security markup
        run: node scripts/security-markup-check.mjs

      - name: Verify Studio API routing architecture
        run: node scripts/security-architecture-check.mjs

      - name: Verify edge anti-crawl and surge protection
        run: node scripts/edge-protection-check.mjs

      - name: Verify global search workspace
        run: node scripts/global-search-check.mjs

      - name: Verify project workspace
        run: node scripts/projects-check.mjs

      - name: Verify task center
        run: node scripts/tasks-check.mjs

      - name: Verify draft workspace
        run: node scripts/drafts-check.mjs

      - name: Verify Workbench aggregation
        run: node scripts/workbench-check.mjs

      - name: Verify Lab registry
        run: node scripts/lab-check.mjs

      - name: Verify TeX Workbench
        run: node scripts/tex-workbench-check.mjs

      - name: Verify Work local bridge pilot
        run: node scripts/work-local-bridge-check.mjs

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-studio-check

      - name: Validate Studio Wrangler JSONC shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc', 'utf8')
            .replace(/^\s*\/\/.*$/gm, '')
            .replace(/\/\*[\s\S]*?\*\//g, '');
          const config = JSON.parse(text);
          if (config.main !== 'worker.js') throw new Error('wrangler.jsonc must retain the worker.js compatibility facade');
          if (!Array.isArray(config.r2_buckets) || !config.r2_buckets.some(b => b.binding === 'STORAGE' && b.bucket_name === 'qsseda-studio-storage')) throw new Error('Studio STORAGE R2 binding is missing');
          const limiterNames = new Set((config.ratelimits || []).map(item => item.name));
          for (const required of ['AUTH_RATE_LIMITER','API_READ_RATE_LIMITER','API_WRITE_RATE_LIMITER','EDGE_GLOBAL_RATE_LIMITER','EDGE_ANON_RATE_LIMITER','EDGE_SUSPECT_RATE_LIMITER','EDGE_EXPENSIVE_RATE_LIMITER']) if (!limiterNames.has(required)) throw new Error(`Missing rate limiter binding: ${required}`);
          console.log('Studio Wrangler configuration looks valid.');
          NODE