name: Audit Studio Worker

on:
  push:
    branches:
      - refactor/studio-worker-modules
    paths:
      - worker.js
      - auth-entry.js
      - auth-worker.js
      - auth-oauth.js
      - auth-pkce-test.js
      - wrangler.jsonc
      - wrangler.auth.jsonc
      - scripts/audit-studio-worker.mjs
      - .github/workflows/audit-studio-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit repository and Worker structure
        run: node scripts/audit-studio-worker.mjs

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-studio-audit

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-auth-audit
