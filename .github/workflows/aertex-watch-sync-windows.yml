# 这条工作流只负责“原生 Windows 客户端 + 安装器 + 固定 R2 release 对象”。
# Watch 网页 Worker 的生产部署由 deploy-production.yml 负责，二者不要混成同一发布事务。
name: Build AERTEX Watch Sync for Windows

on:
  pull_request:
    paths:
      - "AW-Sync/**"
      - "watch-worker.js"
      # watch-cloud-check 会校验公开 /aw-sync.mjs 与审计副本完全一致，因此这个资产变更也必须触发 CI。
      - "watch-web/aw-sync.mjs"
      - "studio/watch-setup-page.js"
      - "scripts/watch-cloud-check.mjs"
      - ".github/workflows/aertex-watch-sync-windows.yml"
  push:
    branches:
      - main
    paths:
      - "AW-Sync/**"
      - "watch-worker.js"
      - "watch-web/aw-sync.mjs"
      - "studio/watch-setup-page.js"
      - "scripts/watch-cloud-check.mjs"
      - ".github/workflows/aertex-watch-sync-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AW-Sync/native
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Prepare AERTEX Watch icon
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --yes --no-progress
            $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          }
          magick -background none -density 512 assets/aertex-watch.svg -define icon:auto-resize=256,128,64,48,32,16 assets/aertex-watch.ico
          if (-not (Test-Path -LiteralPath assets/aertex-watch.ico)) { throw "AERTEX Watch icon was not created." }

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Verify Watch cloud integration
        working-directory: .
        run: node scripts/watch-cloud-check.mjs

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler is unavailable." }
          & $iscc "installer\AERTEX-Watch-Sync.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath "dist\AERTEX-Watch-Sync-Setup.exe")) { throw "Installer was not created." }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: aertex-watch-sync-windows-installer-amd64
          path: AW-Sync/native/dist/AERTEX-Watch-Sync-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # PR 只构建/测试；只有 main push 才把已验证安装器覆盖到固定 R2 key。
  publish-r2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: aertex-watch-sync-windows-installer-amd64
          path: dist

      - name: Publish installer to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.136.3 r2 object put
          qsseda-studio-storage/watch/releases/windows/AERTEX-Watch-Sync-Setup.exe
          --file dist/AERTEX-Watch-Sync-Setup.exe
          --content-type application/vnd.microsoft.portable-executable
          --remote

      - name: Remove legacy portable executable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.136.3 r2 object delete
          qsseda-studio-storage/watch/releases/windows/AERTEX-Watch-Sync.exe
          --remote || true
