name: Apply Studio Phase 4B Page Runtime Rename

on:
  push:
    branches:
      - refactor/studio-phase4-page-runtime
    paths:
      - scripts/apply-studio-phase4-page-runtime.mjs
      - .github/workflows/apply-studio-phase4-page-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture page-runtime baseline
        run: |
          cp studio/ui-core.js /tmp/ui-core-before.js
          cp studio/ui-audit.js /tmp/ui-audit-before.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const page = await import(pathToFileURL('studio/ui-core.js').href + '?before=' + Date.now());
          const handoff = await import(pathToFileURL('studio/auth-handoff.js').href + '?before=' + Date.now());
          const auth = await import(pathToFileURL('studio/auth-pages.js').href + '?before=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const { TEXT } = await import(pathToFileURL('studio/config.js').href + '?before=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?before=' + Date.now());
          const ipInfo = { ip: '203.0.113.92', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          const controlsLinks = buildLinks('zh', '/login');
          const snapshot = {
            primitives: {
              head: page.baseHead('QssedA Test'),
              supabase: page.supabaseScript(),
              controls: page.topControls(controlsLinks, TEXT.zh),
              theme: page.themeScript()
            },
            handoff: handoff.authHandoffHtml('sample-access-value', 'sample-refresh-value', '/zh-cn/dashboard'),
            auth: {},
            pages: {}
          };
          for (const locale of ['en','zh']) {
            snapshot.auth[locale + ':404'] = auth.notFoundPage(TEXT[locale], buildLinks(locale, '/missing'));
            snapshot.auth[locale + ':signup'] = auth.signUpPage(TEXT[locale], buildLinks(locale, '/sign-up'), ipInfo);
            snapshot.auth[locale + ':login'] = auth.loginPage(TEXT[locale], buildLinks(locale, '/login'), ipInfo);
            for (const route of ['/dashboard','/profile/details','/settings/storage','/admin/general']) {
              snapshot.pages[locale + ':' + route] = shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user');
            }
          }
          fs.writeFileSync('/tmp/page-runtime-baseline.json', JSON.stringify(snapshot));
          NODE

      - name: Apply neutral page-runtime rename
        run: node scripts/apply-studio-phase4-page-runtime.mjs

      - name: Validate Studio JavaScript
        run: for file in studio/*.js; do node --check "$file"; done

      - name: Verify exact module rename and dependency cleanup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = fs.readFileSync('/tmp/ui-core-before.js', 'utf8');
          const page = fs.readFileSync('studio/ui-page.js', 'utf8');
          if (page !== before) throw new Error('ui-page.js is not byte-identical to the former ui-core.js');
          if (fs.existsSync('studio/ui-core.js')) throw new Error('ui-core.js still exists');
          const auditBefore = fs.readFileSync('/tmp/ui-audit-before.js', 'utf8');
          const auditAfter = fs.readFileSync('studio/ui-audit.js', 'utf8');
          if (auditAfter !== auditBefore) throw new Error('ui-audit.js changed during Phase 4B');
          const files = fs.readdirSync('studio').filter(name => name.endsWith('.js'));
          for (const file of files) {
            const source = fs.readFileSync('studio/' + file, 'utf8');
            if (source.includes('from "./ui-core.js"')) throw new Error('Remaining ui-core import: ' + file);
          }
          for (const file of ['auth-handoff.js','auth-pages.js','ui-shell.js']) {
            const source = fs.readFileSync('studio/' + file, 'utf8');
            if (!source.includes('from "./ui-page.js"')) throw new Error(file + ' does not import ui-page.js');
          }
          console.log('ui-core.js was an exact neutral-module rename and no consumer remains.');
          NODE

      - name: Compare page primitives and complete rendered pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/page-runtime-baseline.json', 'utf8'));
          const page = await import(pathToFileURL('studio/ui-page.js').href + '?after=' + Date.now());
          const handoff = await import(pathToFileURL('studio/auth-handoff.js').href + '?after=' + Date.now());
          const auth = await import(pathToFileURL('studio/auth-pages.js').href + '?after=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const { TEXT } = await import(pathToFileURL('studio/config.js').href + '?after=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?after=' + Date.now());
          const ipInfo = { ip: '203.0.113.92', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          const controlsLinks = buildLinks('zh', '/login');
          if (page.baseHead('QssedA Test') !== baseline.primitives.head) throw new Error('baseHead output changed');
          if (page.supabaseScript() !== baseline.primitives.supabase) throw new Error('supabaseScript output changed');
          if (page.topControls(controlsLinks, TEXT.zh) !== baseline.primitives.controls) throw new Error('topControls output changed');
          if (page.themeScript() !== baseline.primitives.theme) throw new Error('themeScript output changed');
          if (handoff.authHandoffHtml('sample-access-value', 'sample-refresh-value', '/zh-cn/dashboard') !== baseline.handoff) throw new Error('Auth handoff HTML changed');
          for (const locale of ['en','zh']) {
            if (auth.notFoundPage(TEXT[locale], buildLinks(locale, '/missing')) !== baseline.auth[locale + ':404']) throw new Error('404 page changed: ' + locale);
            if (auth.signUpPage(TEXT[locale], buildLinks(locale, '/sign-up'), ipInfo) !== baseline.auth[locale + ':signup']) throw new Error('Signup page changed: ' + locale);
            if (auth.loginPage(TEXT[locale], buildLinks(locale, '/login'), ipInfo) !== baseline.auth[locale + ':login']) throw new Error('Login page changed: ' + locale);
            for (const route of ['/dashboard','/profile/details','/settings/storage','/admin/general']) {
              const current = shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user');
              if (current !== baseline.pages[locale + ':' + route]) throw new Error('Studio page changed: ' + locale + ':' + route);
            }
          }
          console.log('Page primitives, Auth handoff/Auth pages, and representative Studio pages are byte-identical.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-page-runtime-dry-run

      - name: Commit Phase 4B rename and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase4-page-runtime.mjs
          rm -f .github/workflows/apply-studio-phase4-page-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A studio/ui-core.js studio/ui-page.js studio/ui-audit.js studio/auth-handoff.js studio/auth-pages.js studio/ui-shell.js scripts/apply-studio-phase4-page-runtime.mjs .github/workflows/apply-studio-phase4-page-runtime.yml
          git diff --cached --check
          git commit -m "refactor(studio): rename neutral page runtime module"
          git push
