name: Apply Studio Phase 3C Admin Extraction

on:
  push:
    branches:
      - refactor/studio-phase3-admin
    paths:
      - scripts/apply-studio-phase3-admin.mjs
      - .github/workflows/apply-studio-phase3-admin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture Admin baseline
        run: |
          cp studio/ui-core.js /tmp/ui-core-before.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const core = await import(pathToFileURL('studio/ui-core.js').href + '?before=' + Date.now());
          const routes = ['/admin','/admin/general','/admin/users','/admin/roles','/admin/logs','/admin/system'];
          const snapshot = { routes: {}, adminClient: core.adminClientScript({ ip: '203.0.113.77' }), auditClient: core.auditClientScript({ ip: '203.0.113.77' }) };
          for (const zh of [false, true]) {
            for (const route of routes) snapshot.routes[(zh ? 'zh:' : 'en:') + route] = shell.adminContent(route, zh);
          }
          fs.writeFileSync('/tmp/admin-baseline.json', JSON.stringify(snapshot));
          NODE

      - name: Apply guarded Admin extraction
        run: node scripts/apply-studio-phase3-admin.mjs

      - name: Validate Studio JavaScript
        run: for file in studio/*.js; do node --check "$file"; done

      - name: Verify Admin ownership boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const shell = fs.readFileSync('studio/ui-shell.js', 'utf8');
          const core = fs.readFileSync('studio/ui-core.js', 'utf8');
          const admin = fs.readFileSync('studio/ui-admin.js', 'utf8');
          for (const name of ['adminOverviewContent','adminUsersContent','adminRolesContent','adminLogsContent']) {
            if (shell.includes('export function ' + name)) throw new Error(name + ' still owned by ui-shell.js');
            if (!admin.includes('export function ' + name)) throw new Error(name + ' missing from ui-admin.js');
          }
          if (!admin.includes('export function adminSystemContent')) throw new Error('adminSystemContent missing');
          if (core.includes('export function adminClientScript')) throw new Error('adminClientScript still owned by ui-core.js');
          if (!admin.includes('export function adminClientScript')) throw new Error('adminClientScript missing from ui-admin.js');
          for (const marker of ['adminHubContent','supabaseClient.rpc("is_admin")','restoreWarmAdminSnapshot','qssed-admin-access-v1','hydrateAdminModule(data.user)']) {
            if (!shell.includes(marker)) throw new Error('Shell Admin contract missing: ' + marker);
          }
          const auditPos = shell.indexOf('${auditClientScript(ipInfo)}');
          const profilePos = shell.indexOf('${profileClientScript()}');
          const adminPos = shell.indexOf('${adminClientScript(ipInfo)}');
          const bootstrapPos = shell.indexOf('<script>\n    const loginUrl', adminPos);
          if (!(auditPos >= 0 && auditPos < profilePos && profilePos < adminPos && adminPos < bootstrapPos)) throw new Error('Script order changed');
          NODE

      - name: Compare Admin behavior
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/admin-baseline.json', 'utf8'));
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const core = await import(pathToFileURL('studio/ui-core.js').href + '?after=' + Date.now());
          const admin = await import(pathToFileURL('studio/ui-admin.js').href + '?after=' + Date.now());
          const routes = ['/admin','/admin/general','/admin/users','/admin/roles','/admin/logs','/admin/system'];
          for (const zh of [false, true]) {
            for (const route of routes) {
              const key = (zh ? 'zh:' : 'en:') + route;
              const current = shell.adminContent(route, zh);
              if (current !== baseline.routes[key]) throw new Error('Admin route output changed: ' + key);
            }
          }
          if (admin.adminClientScript({ ip: '203.0.113.77' }) !== baseline.adminClient) throw new Error('Rendered Admin client script changed');
          if (core.auditClientScript({ ip: '203.0.113.77' }) !== baseline.auditClient) throw new Error('Shared audit client script changed');
          console.log('All Admin route outputs and browser runtime are byte-identical.');
          NODE

      - name: Verify ui-core change is Admin-only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let before = fs.readFileSync('/tmp/ui-core-before.js', 'utf8');
          const after = fs.readFileSync('studio/ui-core.js', 'utf8');
          const start = before.indexOf('export function adminClientScript(ipInfo) {');
          const end = before.indexOf('\n\nexport function themeToggle', start);
          if (start < 0 || end < 0) throw new Error('Could not locate old Admin client block');
          const expected = before.slice(0, start) + before.slice(end + 2);
          if (after !== expected) throw new Error('ui-core.js changed outside exact Admin client extraction');
          console.log('ui-core.js differs only by removal of adminClientScript.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-admin-dry-run

      - name: Commit Admin extraction and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase3-admin.mjs
          rm -f .github/workflows/apply-studio-phase3-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/ui-admin.js studio/ui-shell.js studio/ui-core.js scripts/apply-studio-phase3-admin.mjs .github/workflows/apply-studio-phase3-admin.yml
          git diff --cached --check
          git commit -m "refactor(studio): extract Phase 3C Admin domain"
          git push
