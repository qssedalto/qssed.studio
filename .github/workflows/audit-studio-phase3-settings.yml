name: Audit Studio Phase 3B Settings Boundaries

on:
  push:
    branches:
      - refactor/studio-phase3-settings-storage
    paths:
      - .github/workflows/audit-studio-phase3-settings.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inventory Studio UI functions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['studio/ui-shell.js','studio/ui-core.js']) {
            const text = fs.readFileSync(file, 'utf8');
            const lines = text.split('\n');
            console.log('\n### ' + file);
            lines.forEach((line, index) => {
              const match = line.match(/^export function\s+([A-Za-z0-9_$]+)|^function\s+([A-Za-z0-9_$]+)/);
              if (match) console.log(String(index + 1).padStart(5), match[1] || match[2]);
            });
          }
          NODE

      - name: Inventory Settings and Storage references
        run: |
          echo '### Settings/Storage symbols'
          grep -nE 'settings(Content|HubContent|GeneralContent)|appearanceSettingsContent|languageSettingsContent|securityAuditContent|storage(Content|ClientScript)|MAX_STORAGE_FILE_BYTES' studio/ui-shell.js || true
          echo '### Audit functions shared with Settings Security'
          grep -nE 'hydrateProfileAudit|renderSecurityAudit|audit-current-device|audit-device-list|audit-login-timeline|audit-risk-alerts' studio/ui-core.js || true
