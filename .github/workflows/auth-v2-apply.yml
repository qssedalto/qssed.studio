name: Apply Auth v2 Patch

on:
  push:
    branches:
      - feat/auth-portal-v1
    paths:
      - scripts/apply-auth-v2.mjs
      - .github/workflows/auth-v2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/auth-portal-v1
          fetch-depth: 0

      - name: Apply Auth v2 patch
        run: node scripts/apply-auth-v2.mjs

      - name: Validate JavaScript
        run: |
          node --check auth-worker.js
          node --check worker.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js worker.js
          git rm scripts/apply-auth-v2.mjs .github/workflows/auth-v2-apply.yml
          git commit -m "feat: unify Auth account view and Studio session handoff [skip ci]"
          git push origin HEAD:feat/auth-portal-v1
