name: Wire Knowledge Base

on:
  push:
    branches:
      - feature/knowledge-base-v1
    paths:
      - scripts/wire-knowledge-base.mjs
      - .github/workflows/wire-knowledge-base.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-base-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded wiring
        run: node scripts/wire-knowledge-base.mjs
      - name: Validate Knowledge Base route coverage
        run: |
          node --input-type=module <<'NODE'
          import { KNOWLEDGE_PATHS } from './studio/knowledge-routes.js';
          import { knowledgeContent, knowledgePageMeta } from './studio/ui-knowledge.js';
          if (KNOWLEDGE_PATHS.length !== 54) throw new Error(`Expected 54 knowledge routes, got ${KNOWLEDGE_PATHS.length}`);
          for (const path of KNOWLEDGE_PATHS) {
            for (const zh of [true, false]) {
              const meta = knowledgePageMeta(path, zh);
              const html = knowledgeContent(path, zh);
              if (!meta?.title || !meta?.description) throw new Error(`Missing meta for ${path} zh=${zh}`);
              if (!html || html.length < 100) throw new Error(`Missing content for ${path} zh=${zh}`);
            }
          }
          console.log(`Validated ${KNOWLEDGE_PATHS.length} routes in two languages.`);
          NODE
      - name: Check Studio JavaScript syntax
        run: |
          for file in worker.js studio/*.js; do node --check "$file"; done
      - name: Bundle Studio Worker
        run: npx wrangler deploy --dry-run -c wrangler.jsonc
      - name: Commit integrated source and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/wire-knowledge-base.mjs .github/workflows/wire-knowledge-base.yml
          git add studio
          git commit -m "feat(knowledge): build detailed routed knowledge base"
          git push origin HEAD:feature/knowledge-base-v1
