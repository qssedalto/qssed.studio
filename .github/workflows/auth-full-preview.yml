name: Deploy Auth + Studio Preview

on:
  push:
    branches:
      - feat/auth-portal-v1
    paths:
      - auth-worker.js
      - worker.js
      - wrangler.auth.preview.jsonc
      - wrangler.studio.preview.jsonc
      - .github/workflows/auth-full-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsseda-auth-full-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Workers
        run: |
          node --check auth-worker.js
          node --check worker.js

      - name: Deploy temporary Studio preview
        id: studio
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy -c wrangler.studio.preview.jsonc --temporary 2>&1 | tee studio-preview.log
          STUDIO_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' studio-preview.log | tail -n 1)
          test -n "$STUDIO_URL"
          echo "url=$STUDIO_URL" >> "$GITHUB_OUTPUT"

      - name: Point Auth preview at Studio preview
        env:
          STUDIO_URL: ${{ steps.studio.outputs.url }}
        run: |
          node -e 'const fs=require("fs"); const p="wrangler.auth.preview.jsonc"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.vars={MAIN_SITE_URL:process.env.STUDIO_URL}; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'

      - name: Deploy temporary Auth preview
        id: auth
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy -c wrangler.auth.preview.jsonc --temporary 2>&1 | tee auth-preview.log
          AUTH_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' auth-preview.log | tail -n 1)
          test -n "$AUTH_URL"
          echo "url=$AUTH_URL" >> "$GITHUB_OUTPUT"

      - name: Show preview URLs
        run: |
          echo "Auth preview: ${{ steps.auth.outputs.url }}"
          echo "Studio preview: ${{ steps.studio.outputs.url }}"
