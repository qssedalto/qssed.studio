name: Import Staged Cash Transactions Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-staged-cash-transactions-once.yml"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read current R2 data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          cp ".github/tmp/cash-transactions-2026-10-01.json" /tmp/source-transactions.json
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/target.json --remote >/dev/null

      - name: Validate and merge
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sourceTx = JSON.parse(fs.readFileSync('/tmp/source-transactions.json','utf8'));
          const target = JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          if (!Array.isArray(sourceTx) || sourceTx.length !== 6) { console.error('Expected six staged transactions.'); process.exit(2); }
          if (!sourceTx.every(tx => tx.date === '2026-10-01')) { console.error('Unexpected source date.'); process.exit(3); }
          if (!Array.isArray(target.transactions)) { console.error('Invalid target transactions.'); process.exit(4); }
          const ids = new Set(sourceTx.map(tx => tx.id));
          if (ids.size !== 6) { console.error('Source IDs are not unique.'); process.exit(5); }
          const targetIds = new Set(target.transactions.map(tx => tx.id));
          const existing = sourceTx.filter(tx => targetIds.has(tx.id));
          if (existing.length !== 0 && existing.length !== 6) { console.error('Partial prior import detected.'); process.exit(6); }
          const merged = existing.length === 6 ? target : { ...target, transactions: [...target.transactions, ...sourceTx] };
          fs.writeFileSync('/tmp/merged.json', JSON.stringify(merged));
          console.log('Target transactions before:', target.transactions.length);
          console.log('Target transactions after:', merged.transactions.length);
          NODE

      - name: Backup current R2 object
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object put "qsseda-studio-storage/cash/users/$TARGET_USER_ID/backups/pre-github-2026-10-01-import.json" --file /tmp/target.json --content-type application/json --remote >/dev/null

      - name: Write merged R2 object
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object put "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/merged.json --content-type application/json --remote >/dev/null

      - name: Verify six transaction IDs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/verify.json --remote >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('/tmp/source-transactions.json','utf8'));
          const target = JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const ids = new Set((target.transactions || []).map(tx => tx.id));
          const missing = expected.filter(tx => !ids.has(tx.id));
          if (missing.length) { console.error('Verification failed.'); process.exit(7); }
          console.log('Verified all six transactions in R2.');
          console.log('R2 transaction count:', target.transactions.length);
          NODE