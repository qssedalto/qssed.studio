name: Build AERTEX Bridge macOS Packages (unsigned)

on:
  pull_request:
    paths:
      - "local-bridge/macos/**"
      - ".github/workflows/local-bridge-macos.yml"
  push:
    branches: [main]
    paths:
      - "local-bridge/macos/**"
      - ".github/workflows/local-bridge-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BRIDGE_VERSION: "0.5.5-macos"

jobs:
  build-and-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: local-bridge/macos/go.mod
          cache: false
      - name: Verify portable native engine and macOS behavior
        working-directory: local-bridge/macos
        run: |
          go vet ./...
          go test -v ./...
      - name: Build Apple Silicon and Intel executables
        working-directory: local-bridge/macos
        run: |
          set -eu
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$BRIDGE_VERSION" -o dist/AERTEX-Bridge-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$BRIDGE_VERSION" -o dist/AERTEX-Bridge-amd64 .
          lipo -create -output dist/AERTEX-Bridge dist/AERTEX-Bridge-arm64 dist/AERTEX-Bridge-amd64
          file dist/AERTEX-Bridge
          lipo dist/AERTEX-Bridge -verify_arch arm64 x86_64
          chmod 755 dist/AERTEX-Bridge
      - name: Smoke-test actual service, browser restrictions, and TeX status
        shell: bash
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          ./dist/AERTEX-Bridge --background > /tmp/aertex-bridge-smoke.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:32145/health > /tmp/aertex-health.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          grep -q '"runtime":"native-macos"' /tmp/aertex-health.json
          grep -q '"service":"qsseda-local-bridge"' /tmp/aertex-health.json
          ./dist/AERTEX-Bridge --status
          curl -fsS http://127.0.0.1:32145/tex/status > /tmp/aertex-tex.json
          grep -q '"platform":"darwin"' /tmp/aertex-tex.json
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://not-allowed.invalid' http://127.0.0.1:32145/health)
          test "$status" = 403
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:32145/tex/compile)
          test "$status" = 403
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://work.qsseda.com' -H 'Content-Type: application/json' -d '{"engine":"bash","source":"abc"}' http://127.0.0.1:32145/tex/compile)
          test "$status" = 400
      - name: Build branded status manager, icon and installer
        shell: bash
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          rm -rf pkgroot pkgscripts dmgroot installer-resources icon.iconset
          mkdir -p dist pkgroot/Applications/"AERTEX Bridge.app"/Contents/MacOS \
            pkgroot/Applications/"AERTEX Bridge.app"/Contents/Resources \
            pkgroot/Library/"Application Support"/"AERTEX Bridge" \
            pkgroot/Library/LaunchAgents pkgscripts dmgroot installer-resources icon.iconset

          swift packaging/BridgeIcon.swift dist/BridgeIcon.png
          for n in 16 32 128 256 512; do
            sips -s format png -z "$n" "$n" dist/BridgeIcon.png --out "icon.iconset/icon_${n}x${n}.png" >/dev/null
            doubled=$((n * 2))
            sips -s format png -z "$doubled" "$doubled" dist/BridgeIcon.png --out "icon.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o dist/BridgeIcon.icns

          APP="pkgroot/Applications/AERTEX Bridge.app"
          xcrun swiftc -parse-as-library \
            -framework AppKit -framework SwiftUI \
            -o "$APP/Contents/MacOS/BridgeManager" packaging/BridgeManager.swift
          chmod 755 "$APP/Contents/MacOS/BridgeManager"
          cp dist/BridgeIcon.icns "$APP/Contents/Resources/BridgeIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.aertex.bridge.manager</string>
            <key>CFBundleExecutable</key><string>BridgeManager</string>
            <key>CFBundleName</key><string>AERTEX Bridge</string>
            <key>CFBundleDisplayName</key><string>AERTEX Bridge</string>
            <key>CFBundleIconFile</key><string>BridgeIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5.5</string>
            <key>CFBundleVersion</key><string>55</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"

          cp dist/AERTEX-Bridge "pkgroot/Library/Application Support/AERTEX Bridge/AERTEX-Bridge"
          cp packaging/uninstall.command "pkgroot/Library/Application Support/AERTEX Bridge/uninstall.command"
          cp packaging/com.aertex.bridge.plist "pkgroot/Library/LaunchAgents/com.aertex.bridge.plist"
          cp packaging/postinstall pkgscripts/postinstall
          chmod 755 "pkgroot/Library/Application Support/AERTEX Bridge/AERTEX-Bridge" \
            "pkgroot/Library/Application Support/AERTEX Bridge/uninstall.command" pkgscripts/postinstall
          chmod 644 "pkgroot/Library/LaunchAgents/com.aertex.bridge.plist"
          plutil -lint "pkgroot/Library/LaunchAgents/com.aertex.bridge.plist"

          pkgbuild --root pkgroot --scripts pkgscripts \
            --identifier com.aertex.bridge --version 0.5.5 \
            --install-location / dist/AERTEX-Bridge-component.pkg
          cp packaging/Welcome.html installer-resources/
          cp dist/BridgeIcon.png installer-resources/
          sed 's/@VERSION@/0.5.5/g' packaging/Distribution.xml > dist/Distribution.xml
          productbuild --distribution dist/Distribution.xml \
            --resources installer-resources --package-path dist \
            dist/AERTEX-Bridge-macOS-universal.pkg

          pkgutil --check-signature dist/AERTEX-Bridge-macOS-universal.pkg || true
          pkgutil --expand dist/AERTEX-Bridge-macOS-universal.pkg dist/pkg-inspection
          test -f dist/pkg-inspection/Distribution
          rm -rf dist/pkg-inspection

          cp dist/AERTEX-Bridge-macOS-universal.pkg dmgroot/
          cp dist/BridgeIcon.icns dmgroot/.VolumeIcon.icns
          cat > dmgroot/README.txt <<'EOF'
          AERTEX Bridge 0.5.5 for macOS (Apple Silicon + Intel)
          Double-click the .pkg installer.
          The installer also adds AERTEX Bridge.app in Applications for status checks.
          The background LaunchAgent starts at login; the window need not stay open.
          Install MacTeX separately to enable XeLaTeX / pdfLaTeX.
          This is an unsigned, non-notarized preview build.
          Use Apple's per-file Open Anyway procedure only when you trust its source.
          EOF
          hdiutil create -volname "AERTEX Bridge" -srcfolder dmgroot \
            -format UDZO -ov dist/AERTEX-Bridge-macOS-universal.dmg
          shasum -a 256 dist/AERTEX-Bridge-macOS-universal.pkg dist/AERTEX-Bridge-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: aertex-bridge-macos-universal
          path: |
            local-bridge/macos/dist/AERTEX-Bridge-macOS-universal.pkg
            local-bridge/macos/dist/AERTEX-Bridge-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 30

  publish-unsigned:
    # Publishing remains gated behind an actual macOS Go/test/HTTP/build job.
    # A pull request never publishes packages. The Windows release is untouched.
    if: false # Preview only: do not overwrite production R2 until real-Mac validation.
    needs: build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aertex-bridge-macos-universal
          path: unsigned-macos
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Verify unsigned package artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s unsigned-macos/AERTEX-Bridge-macOS-universal.pkg
          test -s unsigned-macos/AERTEX-Bridge-macOS-universal.dmg
          sha256sum unsigned-macos/AERTEX-Bridge-macOS-universal.pkg unsigned-macos/AERTEX-Bridge-macOS-universal.dmg
      - name: Publish tested unsigned DMG and PKG to the existing R2 release paths
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Publish DMG first and PKG last: website probes the PKG HEAD route.
          npx --yes wrangler@4.136.3 r2 object put \
            qsseda-studio-storage/_system/releases/local-bridge/macos-universal/AERTEX-Bridge-macOS-universal.dmg \
            --file unsigned-macos/AERTEX-Bridge-macOS-universal.dmg --remote
          npx --yes wrangler@4.136.3 r2 object put \
            qsseda-studio-storage/_system/releases/local-bridge/macos-universal/AERTEX-Bridge-macOS-universal.pkg \
            --file unsigned-macos/AERTEX-Bridge-macOS-universal.pkg --remote
