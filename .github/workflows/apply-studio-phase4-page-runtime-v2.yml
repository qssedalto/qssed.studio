name: Apply Studio Phase 4B Page Runtime Rename v2

on:
  push:
    branches:
      - refactor/studio-phase4-page-runtime
    paths:
      - .github/workflows/apply-studio-phase4-page-runtime-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture baseline
        run: |
          cp studio/ui-core.js /tmp/ui-core-before.js
          cp studio/ui-audit.js /tmp/ui-audit-before.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const page = await import(pathToFileURL('studio/ui-core.js').href + '?before=' + Date.now());
          const handoff = await import(pathToFileURL('studio/auth-handoff.js').href + '?before=' + Date.now());
          const auth = await import(pathToFileURL('studio/auth-pages.js').href + '?before=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const { TEXT } = await import(pathToFileURL('studio/config.js').href + '?before=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?before=' + Date.now());
          async function snap(response) {
            return { status: response.status, headers: [...response.headers.entries()].sort(), body: await response.text() };
          }
          const ipInfo = { ip: '203.0.113.92', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          const links = buildLinks('zh', '/login');
          const baseline = {
            source: fs.readFileSync('studio/auth-handoff.js', 'utf8'),
            primitives: [page.baseHead('QssedA Test'), page.supabaseScript(), page.topControls(links, TEXT.zh), page.themeScript()],
            handoff: await snap(handoff.authHandoffHtml('a', 'b', '/zh-cn/dashboard')),
            auth: {},
            pages: {}
          };
          for (const locale of ['en','zh']) {
            baseline.auth[locale + ':404'] = auth.notFoundPage(TEXT[locale], buildLinks(locale, '/missing'));
            baseline.auth[locale + ':signup'] = auth.signUpPage(TEXT[locale], buildLinks(locale, '/sign-up'), ipInfo);
            baseline.auth[locale + ':login'] = auth.loginPage(TEXT[locale], buildLinks(locale, '/login'), ipInfo);
            for (const route of ['/dashboard','/profile/details','/settings/storage','/admin/general']) {
              baseline.pages[locale + ':' + route] = shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user');
            }
          }
          fs.writeFileSync('/tmp/page-runtime-v2.json', JSON.stringify(baseline));
          NODE

      - name: Apply neutral module rename
        run: node scripts/apply-studio-phase4-page-runtime.mjs

      - name: Validate exact rename
        run: |
          for file in studio/*.js; do node --check "$file"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = fs.readFileSync('/tmp/ui-core-before.js', 'utf8');
          if (fs.readFileSync('studio/ui-page.js', 'utf8') !== before) throw new Error('ui-page mismatch');
          if (fs.existsSync('studio/ui-core.js')) throw new Error('ui-core remains');
          if (fs.readFileSync('studio/ui-audit.js', 'utf8') !== fs.readFileSync('/tmp/ui-audit-before.js', 'utf8')) throw new Error('ui-audit changed');
          for (const file of ['auth-handoff.js','auth-pages.js','ui-shell.js']) {
            const source = fs.readFileSync('studio/' + file, 'utf8');
            if (!source.includes('from "./ui-page.js"')) throw new Error(file + ' not rewired');
          }
          NODE

      - name: Compare rendered behavior
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/page-runtime-v2.json', 'utf8'));
          const page = await import(pathToFileURL('studio/ui-page.js').href + '?after=' + Date.now());
          const handoff = await import(pathToFileURL('studio/auth-handoff.js').href + '?after=' + Date.now());
          const auth = await import(pathToFileURL('studio/auth-pages.js').href + '?after=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const { TEXT } = await import(pathToFileURL('studio/config.js').href + '?after=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?after=' + Date.now());
          async function snap(response) {
            return { status: response.status, headers: [...response.headers.entries()].sort(), body: await response.text() };
          }
          const ipInfo = { ip: '203.0.113.92', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          const links = buildLinks('zh', '/login');
          const primitives = [page.baseHead('QssedA Test'), page.supabaseScript(), page.topControls(links, TEXT.zh), page.themeScript()];
          if (JSON.stringify(primitives) !== JSON.stringify(baseline.primitives)) throw new Error('page primitives changed');
          if (JSON.stringify(await snap(handoff.authHandoffHtml('a', 'b', '/zh-cn/dashboard'))) !== JSON.stringify(baseline.handoff)) throw new Error('handoff response changed');
          for (const locale of ['en','zh']) {
            if (auth.notFoundPage(TEXT[locale], buildLinks(locale, '/missing')) !== baseline.auth[locale + ':404']) throw new Error('404 changed ' + locale);
            if (auth.signUpPage(TEXT[locale], buildLinks(locale, '/sign-up'), ipInfo) !== baseline.auth[locale + ':signup']) throw new Error('signup changed ' + locale);
            if (auth.loginPage(TEXT[locale], buildLinks(locale, '/login'), ipInfo) !== baseline.auth[locale + ':login']) throw new Error('login changed ' + locale);
            for (const route of ['/dashboard','/profile/details','/settings/storage','/admin/general']) {
              if (shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user') !== baseline.pages[locale + ':' + route]) throw new Error('Studio page changed ' + locale + ':' + route);
            }
          }
          console.log('Phase 4B rendered behavior is unchanged.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-page-runtime-v2

      - name: Commit final Phase 4B
        run: |
          rm -f scripts/apply-studio-phase4-page-runtime.mjs
          rm -f .github/workflows/apply-studio-phase4-page-runtime.yml
          rm -f .github/workflows/apply-studio-phase4-page-runtime-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(studio): rename neutral page runtime module"
          git push
