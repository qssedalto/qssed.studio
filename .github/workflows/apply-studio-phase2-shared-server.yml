name: Apply Studio Phase 2 Shared Server Cleanup

on:
  push:
    branches:
      - refactor/studio-phase2-shared-server
    paths:
      - scripts/apply-studio-phase2-shared-server.mjs
      - .github/workflows/apply-studio-phase2-shared-server.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Phase 2 dependency cleanup
        run: node scripts/apply-studio-phase2-shared-server.mjs

      - name: Validate Studio JavaScript
        run: |
          node --check worker.js
          for file in studio/*.js; do node --check "$file"; done

      - name: Verify dependency direction
        run: |
          ! grep -F 'from "./account-api.js"' studio/storage-api.js
          ! grep -F 'from "./account-api.js"' studio/ui-shell.js
          grep -F 'from "./server-runtime.js"' studio/storage-api.js
          grep -F 'from "./html-utils.js"' studio/ui-shell.js

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-phase2-dry-run

      - name: Commit Phase 2 slice and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase2-shared-server.mjs
          rm -f .github/workflows/apply-studio-phase2-shared-server.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/account-api.js studio/storage-api.js studio/ui-shell.js studio/server-runtime.js studio/html-utils.js scripts/apply-studio-phase2-shared-server.mjs .github/workflows/apply-studio-phase2-shared-server.yml
          git diff --cached --check
          git commit -m "refactor(studio): decouple shared server and HTML utilities"
          git push
