# CI：AERTEX ID / Auth 静态与打包检查。
# 修改登录、OAuth、SSO、共享会话或 Auth Wrangler 配置时都会触发；目标是在合并前同时验证语法、安全契约和 Worker 可打包性。
name: Auth Worker Check

on:
  pull_request:
    paths:
      - "auth-entry.js"
      - "auth-sso.js"
      - "studio/domain-family.js"
      - "studio/appearance.js"
      - "studio/intelligence-theme.js"
      - "studio/account-menu.js"
      - "auth-worker.js"
      - "auth-login-identifier.js"
      - "auth-oauth.js"
      - "auth-pkce-test.js"
      - "auth-edge-protection.js"
      - "scripts/auth-edge-protection-check.mjs"
      - "scripts/appearance-check.mjs"
      - "scripts/brand-check.mjs"
      - "wrangler.auth.jsonc"
      - "AUTH_PORTAL.md"
      - "supabase/migrations/**"
      - ".github/workflows/auth-check.yml"
  push:
    branches:
      - main
    paths:
      - "auth-entry.js"
      - "auth-sso.js"
      - "studio/domain-family.js"
      - "studio/appearance.js"
      - "studio/intelligence-theme.js"
      - "studio/account-menu.js"
      - "auth-worker.js"
      - "auth-login-identifier.js"
      - "auth-oauth.js"
      - "auth-pkce-test.js"
      - "auth-edge-protection.js"
      - "scripts/auth-edge-protection-check.mjs"
      - "scripts/appearance-check.mjs"
      - "scripts/brand-check.mjs"
      - "wrangler.auth.jsonc"
      - "supabase/migrations/**"
      - ".github/workflows/auth-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Check Auth JavaScript syntax
        run: |
          node --check auth-entry.js
          node --check auth-sso.js
          node --check auth-worker.js
          node --check studio/account-menu.js
          node --check studio/appearance.js
          node --check studio/intelligence-theme.js
          node --check auth-login-identifier.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js
          node --check auth-edge-protection.js
          node --check scripts/auth-edge-protection-check.mjs
          node --check scripts/appearance-check.mjs
          node --check scripts/brand-check.mjs

      - name: Verify Auth edge anti-crawl and surge protection
        run: node scripts/auth-edge-protection-check.mjs

      - name: Verify AERTEX product naming
        run: node scripts/brand-check.mjs

      - name: Verify shared appearance runtime
        run: node scripts/appearance-check.mjs

      - name: Verify streamlined Auth handoff contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sso = fs.readFileSync('auth-sso.js', 'utf8');
          const auth = fs.readFileSync('auth-worker.js', 'utf8');
          const entry = fs.readFileSync('auth-entry.js', 'utf8');
          const family = fs.readFileSync('studio/domain-family.js', 'utf8');
          for (const root of ['qsseda.com','qsseda.online','qsseda.studio']) {
            if (!family.includes(`"${root}"`)) throw new Error(`Missing domain root: ${root}`);
          }
          for (const path of ['/sso/start','/sso/import','/sso/complete']) {
            if (!sso.includes(`"${path}"`)) throw new Error(`Missing compatibility SSO path: ${path}`);
          }
          if (!entry.includes('handleAuthSsoRequest(request)')) throw new Error('Auth entry must keep compatibility SSO routing');
          if (!auth.includes('location.replace("/continue"')) throw new Error('Successful Auth login must continue directly without cross-root SSO pages');
          if (!auth.includes('/auth/v1/logout?scope=local')) throw new Error('Interactive sign-out must revoke only the current Supabase session');
          if (!auth.includes('resolveHandoffTarget(request, next, mainSite)')) throw new Error('Auth continuation must collapse GPT/Work handoff hops');
          const start = sso.slice(sso.indexOf('async function startSync'), sso.indexOf('async function importSync'));
          if (start.includes('syncForm(')) throw new Error('Ordinary /sso/start must not visibly relay through every domain family');
          if (!sso.includes('"referrer-policy": "origin"')) throw new Error('Legacy SSO relay pages must preserve an origin-only referrer');
          console.log('Streamlined Auth handoff contract looks valid.');
          NODE

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Validate Auth Wrangler JSONC shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.auth.jsonc', 'utf8')
            .replace(/^\s*\/\/.*$/gm, '')
            .replace(/\/\*[\s\S]*?\*\//g, '');
          const config = JSON.parse(text);
          if (config.main !== 'studio/auth-audit-entry.js') throw new Error('wrangler.auth.jsonc must point to studio/auth-audit-entry.js');
          if (!Array.isArray(config.routes)) throw new Error('Auth routes are missing');
          for (const [host, zone] of [['auth.qsseda.com','qsseda.com'],['auth.qsseda.online','qsseda.online'],['auth.qsseda.studio','qsseda.studio']]) {
            if (!config.routes.some(r => r.pattern === `${host}/*` && r.zone_name === zone)) throw new Error(`${host} exact Worker route is missing`);
            if (!config.routes.some(r => r.pattern === host && r.custom_domain === true)) throw new Error(`${host} custom domain route is missing`);
          }
          const limiterNames = new Set((config.ratelimits || []).map(item => item.name));
          for (const required of ['AUTH_LOGIN_RATE_LIMITER','AUTH_OAUTH_RATE_LIMITER','AUTH_EDGE_GLOBAL_RATE_LIMITER','AUTH_EDGE_ANON_RATE_LIMITER','AUTH_EDGE_SUSPECT_RATE_LIMITER']) {
            if (!limiterNames.has(required)) throw new Error(`Missing Auth rate limiter binding: ${required}`);
          }
          console.log('Auth Wrangler configuration looks valid.');
          NODE
