name: Auth Worker Check

on:
  pull_request:
    paths:
      - "auth-entry.js"
      - "auth-worker.js"
      - "auth-login-identifier.js"
      - "auth-oauth.js"
      - "auth-pkce-test.js"
      - "auth-edge-protection.js"
      - "scripts/auth-edge-protection-check.mjs"
      - "wrangler.auth.jsonc"
      - "AUTH_PORTAL.md"
      - "supabase/migrations/**"
      - ".github/workflows/auth-check.yml"
  push:
    branches:
      - main
    paths:
      - "auth-entry.js"
      - "auth-worker.js"
      - "auth-login-identifier.js"
      - "auth-oauth.js"
      - "auth-pkce-test.js"
      - "auth-edge-protection.js"
      - "scripts/auth-edge-protection-check.mjs"
      - "wrangler.auth.jsonc"
      - "supabase/migrations/**"
      - ".github/workflows/auth-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Auth JavaScript syntax
        run: |
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-login-identifier.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js
          node --check auth-edge-protection.js
          node --check scripts/auth-edge-protection-check.mjs

      - name: Verify Auth edge anti-crawl and surge protection
        run: node scripts/auth-edge-protection-check.mjs

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Validate Auth Wrangler JSONC shape
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.auth.jsonc', 'utf8')
            .replace(/^\s*\/\/.*$/gm, '')
            .replace(/\/\*[\s\S]*?\*\//g, '');
          const config = JSON.parse(text);
          if (config.main !== 'studio/auth-audit-entry.js') throw new Error('wrangler.auth.jsonc must point to studio/auth-audit-entry.js');
          if (!Array.isArray(config.routes)) throw new Error('Auth routes are missing');
          for (const [host, zone] of [['auth.qsseda.com','qsseda.com'],['auth.qsseda.online','qsseda.online'],['auth.qsseda.studio','qsseda.studio']]) {
            if (!config.routes.some(r => r.pattern === `${host}/*` && r.zone_name === zone)) throw new Error(`${host} exact Worker route is missing`);
            if (!config.routes.some(r => r.pattern === host && r.custom_domain === true)) throw new Error(`${host} custom domain route is missing`);
          }
          const limiterNames = new Set((config.ratelimits || []).map(item => item.name));
          for (const required of ['AUTH_LOGIN_RATE_LIMITER','AUTH_OAUTH_RATE_LIMITER','AUTH_EDGE_GLOBAL_RATE_LIMITER','AUTH_EDGE_ANON_RATE_LIMITER','AUTH_EDGE_SUSPECT_RATE_LIMITER']) {
            if (!limiterNames.has(required)) throw new Error(`Missing Auth rate limiter binding: ${required}`);
          }
          console.log('Auth Wrangler configuration looks valid.');
          NODE
