name: Finalize Studio Phase 4 Docs

on:
  push:
    branches:
      - docs/studio-phase4-completion
    paths:
      - .github/workflows/finalize-studio-phase4-docs.yml
      - scripts/finalize-studio-phase4-docs.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Phase 4 completion documentation
        run: node scripts/finalize-studio-phase4-docs.mjs

      - name: Validate current architecture documentation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = fs.readFileSync('ReadMe.md', 'utf8');
          const modular = fs.readFileSync('docs/STUDIO_WORKER_MODULARIZATION.md', 'utf8');
          const phase4 = fs.readFileSync('docs/STUDIO_PHASE4_SHARED_INVENTORY.md', 'utf8');
          const auth = fs.readFileSync('AUTH_PORTAL.md', 'utf8');
          const studio = fs.readFileSync('studio/README.md', 'utf8');
          for (const name of ['ui-page.js','ui-audit.js','ui-primitives.js','ui-style-profile.js','ui-style-admin.js','ui-style-dashboard.js']) {
            if (!root.includes(name) || !modular.includes(name)) throw new Error('Current module missing from docs: ' + name);
          }
          if (!root.includes('Phase 4 — shared-layer cleanup and final consolidation') || !root.includes('✅ Phase 4')) throw new Error('Root README does not mark Phase 4 complete');
          if (!modular.includes('| 4 | Shared UI/runtime cleanup and final consolidation | ✅ Complete |')) throw new Error('Modularization status is stale');
          if (!phase4.includes('**Phase 4E — complete:**') || !phase4.includes('## Phase 4 completion')) throw new Error('Phase 4 inventory is not closed');
          if (!studio.includes('Phase 4 is now closed')) throw new Error('Studio README does not close Phase 4');
          for (const name of ['auth-entry.js','auth-worker.js','auth-oauth.js','auth-pkce-test.js']) {
            if (!auth.includes(name)) throw new Error('AUTH_PORTAL missing Auth deployment module: ' + name);
          }
          if (!root.includes('supabase_admin_tables.sql') || !root.includes('supabase_audit_tables.sql')) throw new Error('Supabase baseline retention is undocumented');
          console.log('Current architecture and Phase 4 completion documentation are consistent.');
          NODE
          git diff --check

      - name: Validate unchanged runtime
        run: |
          node --check worker.js
          for file in studio/*.js; do node --check "$file"; done
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js
          npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir /tmp/wrangler-phase4-docs
          npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir /tmp/wrangler-phase4-auth-docs

      - name: Commit docs and remove one-off files
        run: |
          rm -f .github/workflows/finalize-studio-phase4-docs.yml scripts/finalize-studio-phase4-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReadMe.md AUTH_PORTAL.md studio/README.md docs/STUDIO_WORKER_MODULARIZATION.md docs/STUDIO_PHASE4_SHARED_INVENTORY.md .github/workflows/finalize-studio-phase4-docs.yml scripts/finalize-studio-phase4-docs.mjs
          git diff --cached --check
          git commit -m "docs(studio): close Phase 4 modularization"
          git push
