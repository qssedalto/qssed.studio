name: Admin Control Plane Branch Check

on:
  push:
    branches:
      - admin-control-plane
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Validate admin split
        run: |
          set -euo pipefail
          node --check admin-worker.js
          for file in admin/*.js; do node --check "$file"; done
          node --check worker.js
          node --check gpt-worker.js
          node --check studio/admin-subdomain.js
          node --check studio/domain-family.js
          node --check studio/entry.js
          node --check studio/ui-shell.js
          node --check studio/ui-dashboard.js
          node --check scripts/admin-control-plane-check.mjs
          node scripts/admin-control-plane-check.mjs
          node --check scripts/gpt-subdomain-check.mjs
          node scripts/gpt-subdomain-check.mjs
          node --check scripts/gpt-ui-check.mjs
          node scripts/gpt-ui-check.mjs
          node --check scripts/security-architecture-check.mjs
          node scripts/security-architecture-check.mjs
