name: Hotfix Auth Handoff Origin v2

on:
  push:
    branches:
      - main
    paths:
      - scripts/hotfix-auth-origin-v2.mjs

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Safari Auth handoff hotfix
        run: node scripts/hotfix-auth-origin-v2.mjs

      - name: Validate Workers
        run: |
          node --check worker.js
          node --check auth-worker.js

      - name: Commit hotfix and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js auth-worker.js
          git rm scripts/hotfix-auth-origin-v2.mjs .github/workflows/hotfix-auth-origin-v2.yml
          git commit -m "fix: support iOS Auth handoff in production"
          git push

      - name: Deploy QssedA Studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc

      - name: Deploy QssedA Auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc
