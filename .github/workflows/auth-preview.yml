name: Deploy QssedA Auth Preview

on:
  push:
    branches:
      - feat/auth-portal-v1
    paths:
      - auth-worker.js
      - wrangler.auth.preview.jsonc
      - .github/workflows/auth-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsseda-auth-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Auth Worker syntax
        run: node --check auth-worker.js

      - name: Upload public preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 versions upload -c wrangler.auth.preview.jsonc --preview-alias iphone-review
