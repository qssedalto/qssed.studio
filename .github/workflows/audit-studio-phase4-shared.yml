name: Audit Studio Phase 4 Shared Layers

on:
  push:
    branches:
      - refactor/studio-phase4-shared-audit
    paths:
      - .github/workflows/audit-studio-phase4-shared.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Studio import graph
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('studio').filter(name => name.endsWith('.js')).sort();
          for (const file of files) {
            const source = fs.readFileSync('studio/' + file, 'utf8');
            const imports = [...source.matchAll(/^import\s+.*?from\s+["'](.+?)["'];?$/gm)].map(match => match[1]);
            console.log(`${file}: ${imports.length ? imports.join(', ') : '(none)'}`);
          }
          NODE

      - name: Print top-level exported functions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('studio').filter(name => name.endsWith('.js')).sort();
          for (const file of files) {
            const source = fs.readFileSync('studio/' + file, 'utf8');
            const names = [...source.matchAll(/^export\s+(?:async\s+)?function\s+([A-Za-z0-9_$]+)/gm)].map(match => match[1]);
            if (names.length) console.log(`${file}: ${names.join(', ')}`);
          }
          NODE

      - name: Map shared UI symbol consumers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('studio').filter(name => name.endsWith('.js')).sort();
          const symbols = [
            'baseHead','supabaseScript','auditClientScript','themeToggle','languageToggle','topControls','themeScript',
            'statusContent','osHubIcon','osHubCard','osHubGrid','escapeHtmlText'
          ];
          for (const symbol of symbols) {
            const users = [];
            for (const file of files) {
              const source = fs.readFileSync('studio/' + file, 'utf8');
              const count = source.split(symbol).length - 1;
              if (count) users.push(`${file}(${count})`);
            }
            console.log(`${symbol}: ${users.join(', ') || '(none)'}`);
          }
          NODE

      - name: Inspect ui-core and shell responsibility markers
        run: |
          echo '### ui-core exports / imports'
          grep -nE '^(import|export function|export async function)' studio/ui-core.js || true
          echo '### auth consumers of ui-core'
          grep -nE 'ui-core|baseHead|supabaseScript|auditClientScript|themeScript|topControls' studio/auth-pages.js studio/auth-handoff.js || true
          echo '### shell shared helpers and injections'
          grep -nE 'statusContent|osHubIcon|osHubCard|osHubGrid' studio/ui-shell.js studio/ui-profile.js studio/ui-admin.js studio/ui-settings.js studio/ui-information.js studio/ui-workspace.js || true
          echo '### routing/html shared helpers'
          grep -nE 'from "\./(routing|html-utils|server-runtime)\.js"' studio/*.js || true

      - name: Remove one-off audit workflow
        run: |
          rm -f .github/workflows/audit-studio-phase4-shared.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-studio-phase4-shared.yml
          git diff --cached --check
          git commit -m "chore(studio): remove Phase 4 audit workflow"
          git push
