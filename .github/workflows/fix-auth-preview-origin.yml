name: Fix Auth Preview Origin

on:
  push:
    branches:
      - feat/auth-portal-v1
    paths:
      - scripts/fix-auth-preview-origin.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/auth-portal-v1
          fetch-depth: 0

      - name: Apply fix
        run: node scripts/fix-auth-preview-origin.mjs

      - name: Validate JavaScript
        run: |
          node --check auth-worker.js
          node --check worker.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js worker.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow paired preview handoff and add sign out"
          git push origin HEAD:feat/auth-portal-v1
