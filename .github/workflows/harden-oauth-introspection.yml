name: Harden OAuth Introspection

on:
  push:
    branches:
      - feat/auth-pkce-v1
    paths:
      - scripts/harden-oauth-introspection.mjs
      - .github/workflows/harden-oauth-introspection.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-pkce-v1

      - name: Apply hardening patch
        run: node scripts/harden-oauth-introspection.mjs

      - name: Validate and bundle Auth Worker
        run: |
          node --check auth-worker.js
          node --check auth-oauth.js
          npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js auth-oauth.js
          git commit -m "fix(auth): keep OAuth introspection private"
          git push origin HEAD:feat/auth-pkce-v1
