name: Fix Auth OAuth Template Escaping

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-auth-oauth-template-escaping.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair template literals
        run: node scripts/fix-auth-oauth-template-escaping.mjs

      - name: Validate JavaScript
        run: |
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Commit repair and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-oauth.js
          git rm scripts/fix-auth-oauth-template-escaping.mjs .github/workflows/fix-auth-oauth-template-escaping.yml
          git commit -m "fix(auth): repair OAuth UI template literals"
          git push
