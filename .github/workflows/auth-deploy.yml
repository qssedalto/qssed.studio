name: Deploy QssedA Auth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsseda-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: auth-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Auth Worker syntax
        run: |
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-auth-check

      - name: Deploy auth.qsseda.studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc
