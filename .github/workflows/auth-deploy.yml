name: Deploy QssedA Auth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsseda-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: auth-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Check Auth Worker syntax
        run: |
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-login-identifier.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js
          node --check auth-edge-protection.js
          node --check scripts/auth-edge-protection-check.mjs
          node scripts/auth-edge-protection-check.mjs

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-auth-check

      - name: Deploy auth.qsseda.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.auth.jsonc

      - name: Verify Auth edge protection
        shell: bash
        run: |
          set -euo pipefail
          robots_status="$(curl --silent --show-error --max-time 20 --output /tmp/qsseda-auth-robots.txt --write-out '%{http_code}' 'https://auth.qsseda.com/robots.txt' || true)"
          if [ "$robots_status" != "200" ] || ! grep -q '^Disallow: /$' /tmp/qsseda-auth-robots.txt; then
            echo "Auth edge protection regression: robots.txt is not denying crawler access."
            echo "HTTP status: ${robots_status:-unknown}"
            cat /tmp/qsseda-auth-robots.txt || true
            exit 1
          fi

          probe_status="$(curl --silent --show-error --max-time 20 --output /tmp/qsseda-auth-probe.txt --write-out '%{http_code}' 'https://auth.qsseda.com/.env' || true)"
          if [ "$probe_status" != "404" ]; then
            echo "Auth edge protection regression: scanner probe was not rejected before Auth routing."
            echo "HTTP status: ${probe_status:-unknown}"
            cat /tmp/qsseda-auth-probe.txt || true
            exit 1
          fi
