name: P0 P1 Stability Audit

on:
  push:
    branches: [audit/p0-p1-stability-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-p1-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Build pinned browser dependencies
        run: |
          if test -f tex-vendor/package-lock.json; then
            npm ci --prefix tex-vendor --no-audit --no-fund
          else
            npm install --prefix tex-vendor --no-audit --no-fund
          fi
          node tex-vendor/build.mjs
      - name: Preserve exact source and build for isolated local review
        run: |
          mkdir -p /tmp/p0-p1-build
          tar -czf /tmp/p0-p1-build/review.tar.gz --exclude='./.git' --exclude='./.wrangler' .
          git rev-parse HEAD > /tmp/p0-p1-build/commit.txt
          npm audit --prefix tex-vendor --json > /tmp/p0-p1-build/dependency-audit.json || true
      - uses: actions/upload-artifact@v6
        with:
          name: p0-p1-build-${{ github.sha }}
          path: /tmp/p0-p1-build/
          retention-days: 1
      - name: Execute every existing regression and real-browser smoke test
        shell: bash
        run: |
          mkdir -p /tmp/p0-p1-results
          failed=0
          for file in scripts/*-check.mjs scripts/tex-compile-toolbar-browser.mjs scripts/tex-file-chat-popup-browser.mjs; do
            name=$(basename "$file" .mjs)
            if timeout 120 node "$file" > "/tmp/p0-p1-results/${name}.log" 2>&1; then
              echo "PASS $file" | tee -a /tmp/p0-p1-results/summary.txt
            else
              echo "FAIL $file" | tee -a /tmp/p0-p1-results/summary.txt
              tail -25 "/tmp/p0-p1-results/${name}.log"
              failed=1
            fi
          done
          cat /tmp/p0-p1-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Bundle Work Worker without deployment
        if: always()
        run: npx --yes wrangler@4.136.3 deploy -c wrangler.work.jsonc --dry-run --outdir /tmp/p0-p1-bundle
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p0-p1-results-${{ github.sha }}
          path: |
            /tmp/p0-p1-results/
            /tmp/aertex-filechat-visual/*.png
            /tmp/aertex-compile-toolbar-visual/*.png
          if-no-files-found: warn
          retention-days: 7
