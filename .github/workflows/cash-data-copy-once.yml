name: Cash Data Copy Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cash-data-copy-once.yml"

permissions:
  contents: read

jobs:
  inspect-and-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Cash objects
        id: locate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/qsseda-studio-storage/objects?prefix=cash%2Fusers%2F")"
          printf '%s' "$response" > /tmp/r2-list.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/r2-list.json','utf8'));
          if (!body.success) {
            console.error('R2 listing failed.');
            process.exit(2);
          }
          const target = process.env.TARGET_USER_ID;
          const keys = (body.result || [])
            .map(x => String(x.key || ''))
            .filter(k => /^cash\/users\/[0-9a-f-]{36}\/data\.json$/i.test(k));
          const source = keys.filter(k => !k.includes('/' + target + '/'));
          const targetKey = `cash/users/${target}/data.json`;
          console.log(`Cash user data objects found: ${keys.length}`);
          console.log(`Non-target source objects found: ${source.length}`);
          if (source.length !== 1) {
            console.error('Expected exactly one non-target Cash data object; refusing to copy.');
            for (const key of source) console.error('Candidate:', key);
            process.exit(3);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_key=${source[0]}\ntarget_key=${targetKey}\n`);
          NODE

      - name: Inspect target without exposing bill contents
        id: target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/${{ steps.locate.outputs.target_key }}" --file /tmp/target.json --remote >/tmp/target-get.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Target Cash object does not exist yet."
            echo "target_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "target_exists=true" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          const counts = {
            transactions: Array.isArray(d.transactions) ? d.transactions.length : -1,
            plannedEvents: Array.isArray(d.plannedEvents) ? d.plannedEvents.length : -1,
            expectedEvents: Array.isArray(d.expectedEvents) ? d.expectedEvents.length : -1,
            recurringExpenses: Array.isArray(d.recurringExpenses) ? d.recurringExpenses.length : -1
          };
          console.log('Target structural counts:', JSON.stringify(counts));
          const hasUserEntries = counts.transactions > 0 || counts.expectedEvents > 0;
          if (hasUserEntries) {
            console.error('Target already contains user-entered ledger/expected data; refusing to overwrite.');
            process.exit(4);
          }
          NODE

      - name: Copy source Cash data to target account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/${{ steps.locate.outputs.source_key }}" --file /tmp/source.json --remote
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const counts = {
            transactions: Array.isArray(d.transactions) ? d.transactions.length : -1,
            plannedEvents: Array.isArray(d.plannedEvents) ? d.plannedEvents.length : -1,
            expectedEvents: Array.isArray(d.expectedEvents) ? d.expectedEvents.length : -1,
            recurringExpenses: Array.isArray(d.recurringExpenses) ? d.recurringExpenses.length : -1
          };
          console.log('Source structural counts:', JSON.stringify(counts));
          if (counts.transactions < 0 || counts.plannedEvents < 0 || counts.expectedEvents < 0 || counts.recurringExpenses < 0) {
            console.error('Source does not look like a valid Cash data document.');
            process.exit(5);
          }
          NODE
          npx --yes wrangler@4.136.3 r2 object put "qsseda-studio-storage/${{ steps.locate.outputs.target_key }}" --file /tmp/source.json --content-type application/json --remote
          echo "Cash data copy completed."

      - name: Verify copied object
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/${{ steps.locate.outputs.target_key }}" --file /tmp/verify.json --remote >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const a = fs.readFileSync('/tmp/source.json');
          const b = fs.readFileSync('/tmp/verify.json');
          if (!a.equals(b)) {
            console.error('Verification failed: copied bytes differ.');
            process.exit(6);
          }
          console.log('Verified: source and target Cash JSON are byte-identical.');
          NODE
