name: Cash Data Copy Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cash-data-copy-once.yml"

permissions:
  contents: read

jobs:
  verify-target:
    runs-on: ubuntu-latest
    steps:
      - name: Verify qssed_a Cash object without exposing bill contents
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          target_key="cash/users/$TARGET_USER_ID/data.json"

          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/qsseda-studio-storage/objects?prefix=cash%2Fusers%2F")"
          printf '%s' "$response" > /tmp/r2-list.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/r2-list.json','utf8'));
          if (!body.success) process.exit(2);
          const target = 'cash/users/' + process.env.TARGET_USER_ID + '/data.json';
          const keys = (body.result || []).map(x => String(x.key || '')).filter(k => /^cash\/users\/[0-9a-f-]{36}\/data\.json$/i.test(k));
          console.log('Cash user data objects found:', keys.length);
          if (keys.length !== 1 || keys[0] !== target) {
            console.error('Cash object ownership does not match the expected target account.');
            process.exit(3);
          }
          console.log('The sole Cash object already belongs to the target AERTEX user.');
          NODE

          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/$target_key" --file /tmp/target.json --remote >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          const counts = {
            transactions: Array.isArray(d.transactions) ? d.transactions.length : -1,
            plannedEvents: Array.isArray(d.plannedEvents) ? d.plannedEvents.length : -1,
            expectedEvents: Array.isArray(d.expectedEvents) ? d.expectedEvents.length : -1,
            recurringExpenses: Array.isArray(d.recurringExpenses) ? d.recurringExpenses.length : -1
          };
          console.log('Target structural counts:', JSON.stringify(counts));
          if (Object.values(counts).some(v => v < 0)) {
            console.error('Target Cash JSON structure is invalid.');
            process.exit(4);
          }
          NODE
