name: Audit Studio Phase 4D Remainder

on:
  push:
    branches:
      - refactor/studio-phase4d-remainder-audit
    paths:
      - .github/workflows/audit-studio-phase4d-remainder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect remaining style ownership
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('studio/ui-styles.js', 'utf8');
          const lines = source.split('\n');
          console.log('ui-styles.js:', lines.length, 'lines /', Buffer.byteLength(source), 'bytes');
          console.log('\n### Existing external style fragments');
          for (const name of fs.readdirSync('studio').filter(name => name.startsWith('ui-style-') && name.endsWith('.js')).sort()) {
            const text = fs.readFileSync('studio/' + name, 'utf8');
            console.log(name + ':', text.split('\n').length, 'lines /', Buffer.byteLength(text), 'bytes');
          }
          console.log('\n### Remaining comment markers');
          lines.forEach((line, index) => {
            if (/\/\*.*(?:APPLE|PROFILE|ADMIN|SETTINGS|STORAGE|DASHBOARD|AUDIT|OS_).*\*\//i.test(line)) console.log(`${index + 1}: ${line.trim()}`);
          });
          console.log('\n### Prefix line spans');
          for (const prefix of ['storage','settings','audit','admin','profile','dashboard','os-hub','os-nav','os-shell']) {
            const hits = [];
            lines.forEach((line,index) => { if (line.toLowerCase().includes(prefix)) hits.push(index+1); });
            if (!hits.length) { console.log(prefix + ': none'); continue; }
            console.log(`${prefix}: count=${hits.length} first=${hits[0]} last=${hits.at(-1)}`);
          }
          console.log('\n### Media blocks containing mixed domains');
          let depth = 0;
          let start = -1;
          let block = [];
          for (let i=0;i<lines.length;i++) {
            const line = lines[i];
            if (start < 0 && line.includes('@media')) { start=i; depth=0; block=[]; }
            if (start >= 0) {
              block.push(line);
              depth += (line.match(/\{/g)||[]).length - (line.match(/\}/g)||[]).length;
              if (depth===0 && block.length>1) {
                const text=block.join('\n').toLowerCase();
                const domains=['storage','settings','audit','admin','profile','dashboard','os-hub','os-nav','os-shell'].filter(d=>text.includes(d));
                if (domains.length>1) console.log(`lines ${start+1}-${i+1}: ${domains.join(', ')}`);
                start=-1; block=[];
              }
            }
          }
          console.log('\n### Possibly unused imports in Studio modules');
          for (const file of fs.readdirSync('studio').filter(name=>name.endsWith('.js')).sort()) {
            const text=fs.readFileSync('studio/'+file,'utf8');
            for (const match of text.matchAll(/^import\s+\{([^}]+)\}\s+from\s+["']([^"']+)["'];?$/gm)) {
              const body=text.slice(match.index+match[0].length);
              for (const item of match[1].split(',')) {
                const local=item.trim().split(/\s+as\s+/).at(-1);
                const count=(body.match(new RegExp(`\\b${local}\\b`,'g'))||[]).length;
                if (count===0) console.log(`${file}: ${local} from ${match[2]}`);
              }
            }
          }
          NODE

      - name: Remove one-off audit workflow
        run: |
          rm -f .github/workflows/audit-studio-phase4d-remainder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-studio-phase4d-remainder.yml
          git diff --cached --check
          git commit -m "chore(studio): remove Phase 4D remainder audit workflow"
          git push
