name: Import GitHub Cash Transactions Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-github-cash-transactions-once.yml"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source and target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://raw.githubusercontent.com/qssedalto/cash/main/user-data/data.json" -o /tmp/source.json
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/target.json --remote >/dev/null

      - name: Validate and merge six GitHub transactions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const target = JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          const sourceTx = Array.isArray(source.transactions) ? source.transactions.filter(tx => tx.date === '2026-10-01') : [];
          if (sourceTx.length !== 6) { console.error('Expected exactly six 2026-10-01 transactions; found', sourceTx.length); process.exit(2); }
          if (!Array.isArray(target.transactions)) { console.error('R2 target has invalid transactions structure.'); process.exit(3); }
          const ids = new Set(sourceTx.map(tx => tx.id));
          if (ids.size !== 6) { console.error('Source transaction IDs are not unique.'); process.exit(4); }
          const existingIds = new Set(target.transactions.map(tx => tx.id));
          const alreadyPresent = sourceTx.filter(tx => existingIds.has(tx.id));
          const missing = sourceTx.filter(tx => !existingIds.has(tx.id));
          if (alreadyPresent.length && missing.length) { console.error('Target contains a partial prior import; refusing ambiguous merge.'); process.exit(5); }
          const merged = alreadyPresent.length === 6 ? target : { ...target, transactions: [...target.transactions, ...sourceTx] };
          fs.writeFileSync('/tmp/merged.json', JSON.stringify(merged));
          console.log('GitHub source transactions:', sourceTx.length);
          console.log('Target transaction count before:', target.transactions.length);
          console.log('Target transaction count after:', merged.transactions.length);
          NODE

      - name: Backup current R2 Cash data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object put "qsseda-studio-storage/cash/users/$TARGET_USER_ID/backups/pre-github-2026-10-01-import.json" --file /tmp/target.json --content-type application/json --remote >/dev/null
          echo "Backed up current target before import."

      - name: Write merged Cash data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object put "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/merged.json --content-type application/json --remote >/dev/null
          echo "Merged Cash data written to R2."

      - name: Verify imported transaction IDs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_USER_ID: eb8c338d-b533-4e7a-987f-491739f925ed
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.3 r2 object get "qsseda-studio-storage/cash/users/$TARGET_USER_ID/data.json" --file /tmp/verify.json --remote >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const target = JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const expected = source.transactions.filter(tx => tx.date === '2026-10-01');
          const targetIds = new Set((target.transactions || []).map(tx => tx.id));
          const missing = expected.filter(tx => !targetIds.has(tx.id));
          if (missing.length) { console.error('Verification failed; missing IDs:', missing.length); process.exit(6); }
          console.log('Verified all six GitHub transactions now exist in R2.');
          console.log('R2 transaction count:', target.transactions.length);
          NODE