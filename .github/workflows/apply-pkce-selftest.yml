name: Apply PKCE Self-Test

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-pkce-selftest.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply PKCE self-test wiring
        run: node scripts/apply-pkce-selftest.mjs

      - name: Validate JavaScript
        run: |
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Commit real files and remove one-off wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js auth-pkce-test.js .github/workflows/deploy-production.yml .github/workflows/auth-check.yml supabase/migrations/202609131045_pkce_browser_selftest_client.sql
          git rm scripts/apply-pkce-selftest.mjs .github/workflows/apply-pkce-selftest.yml
          git commit -m "feat(auth): add production PKCE browser self-test"
          git push
