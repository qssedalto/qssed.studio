name: Hotfix Auth Handoff Origin

on:
  push:
    branches:
      - main
    paths:
      - scripts/hotfix-auth-origin.mjs

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Safari Auth handoff hotfix
        run: node scripts/hotfix-auth-origin.mjs

      - name: Validate Worker
        run: node --check worker.js

      - name: Commit hotfix and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git rm scripts/hotfix-auth-origin.mjs .github/workflows/hotfix-auth-origin.yml
          git commit -m "fix: accept Safari same-site Auth handoff"
          git push
