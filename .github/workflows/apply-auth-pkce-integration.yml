name: Apply Auth PKCE Integration

on:
  push:
    branches:
      - feat/auth-pkce-v1
    paths:
      - scripts/apply-auth-pkce-integration.mjs
      - .github/workflows/apply-auth-pkce-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-pkce-v1

      - name: Apply integration
        run: node scripts/apply-auth-pkce-integration.mjs

      - name: Validate JavaScript
        run: |
          node --check auth-worker.js
          node --check auth-oauth.js

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Commit Auth Worker integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js
          git commit -m "feat(auth): wire OAuth PKCE into Auth Worker"
          git push origin HEAD:feat/auth-pkce-v1
