name: SSO audit source export
on:
  push:
    branches: [fix/sso-single-refresh-owner-20261114]
    paths: ['.github/workflows/sso-audit-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make reproducible source archive
        run: |
          mkdir -p /tmp/aertex-sso-audit
          git archive HEAD | gzip -9 > /tmp/aertex-sso-audit/source.tar.gz
          git rev-parse HEAD > /tmp/aertex-sso-audit/commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: sso-source-${{ github.sha }}
          path: /tmp/aertex-sso-audit/
          retention-days: 1
