name: Admin RPC Security Branch Check

on:
  push:
    branches:
      - admin-rpc-security-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Validate administrator security architecture
        run: |
          set -euo pipefail
          node --check admin-worker.js
          for file in admin/*.js; do node --check "$file"; done
          node --check studio/entry.js
          node --check studio/ai-gateway.js
          node --check studio/access-audit.js
          node --check scripts/admin-control-plane-check.mjs
          node scripts/admin-control-plane-check.mjs
          node --check scripts/security-architecture-check.mjs
          node scripts/security-architecture-check.mjs
          node --check scripts/security-markup-check.mjs
          node scripts/security-markup-check.mjs
          node --check scripts/gpt-subdomain-check.mjs
          node scripts/gpt-subdomain-check.mjs
          node --check scripts/gpt-ui-check.mjs
          node scripts/gpt-ui-check.mjs
