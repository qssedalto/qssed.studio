name: Apply OAuth Introspection

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-oauth-introspection.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply introspection wiring
        run: node scripts/apply-oauth-introspection.mjs

      - name: Validate Auth JavaScript
        run: node --check auth-oauth.js

      - name: Commit endpoint and clean one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-oauth.js supabase/migrations/202609131150_oauth_resource_server_introspection_v1.sql
          git rm scripts/apply-oauth-introspection.mjs .github/workflows/apply-oauth-introspection.yml
          git commit -m "feat(auth): add protected OAuth token introspection"
          git push
