name: Finalize Auth Associations

on:
  push:
    branches:
      - refactor/studio-worker-modules
    paths:
      - scripts/finalize-auth-associations.mjs
      - .github/workflows/finalize-auth-associations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Finalize Auth associations
        run: node scripts/finalize-auth-associations.mjs

      - name: Validate Auth JavaScript
        run: |
          node --check auth-entry.js
          node --check auth-worker.js
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Bundle Auth Worker
        run: npx --yes wrangler@4 deploy -c wrangler.auth.jsonc --dry-run --outdir .wrangler-auth-finalize

      - name: Commit association fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-worker.js AUTH_PORTAL.md
          git commit -m "fix(auth): connect protected introspection route"
          git push
