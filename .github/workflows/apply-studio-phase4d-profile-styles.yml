name: Apply Studio Phase 4D Profile Styles

on:
  push:
    branches:
      - refactor/studio-phase4d-profile-styles
    paths:
      - scripts/apply-studio-phase4d-profile-styles.mjs
      - .github/workflows/apply-studio-phase4d-profile-styles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture complete style/page baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const styles = await import(pathToFileURL('studio/ui-styles.js').href + '?before=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const { TEXT, OS_PATHS } = await import(pathToFileURL('studio/config.js').href + '?before=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?before=' + Date.now());
          const ipInfo = { ip: '203.0.113.77', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          const pages = {};
          for (const locale of ['en','zh']) {
            for (const route of Array.from(OS_PATHS).sort()) {
              pages[locale + ':' + route] = shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user');
            }
          }
          fs.writeFileSync('/tmp/phase4d-profile-baseline.json', JSON.stringify({ styles: styles.osStyles(), pages }));
          const source = fs.readFileSync('studio/ui-styles.js', 'utf8');
          const start = source.indexOf('    /* PROFILE_HOME_V3 */');
          const end = source.indexOf('    /* SETTINGS_GENERAL_ROUTE_V1 */', start);
          if (start < 0 || end < 0) throw new Error('Profile style block markers not found');
          fs.writeFileSync('/tmp/phase4d-profile-block.txt', source.slice(start, end));
          NODE

      - name: Apply Profile style extraction
        run: node scripts/apply-studio-phase4d-profile-styles.mjs

      - name: Validate exact ownership extraction
        run: |
          for file in studio/*.js; do node --check "$file"; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const block = fs.readFileSync('/tmp/phase4d-profile-block.txt', 'utf8');
          const profileSource = fs.readFileSync('studio/ui-style-profile.js', 'utf8');
          const prefix = 'export function profileStyles() {\n  return `';
          const suffix = '`;\n}\n';
          if (!profileSource.startsWith(prefix) || !profileSource.endsWith(suffix)) throw new Error('Unexpected profile style module wrapper');
          const extracted = profileSource.slice(prefix.length, -suffix.length);
          if (extracted !== block) throw new Error('Profile style block changed during extraction');
          const styles = fs.readFileSync('studio/ui-styles.js', 'utf8');
          if (styles.includes('/* PROFILE_HOME_V3 */')) throw new Error('Profile block remains in ui-styles.js');
          if (!styles.includes('import { profileStyles } from "./ui-style-profile.js";')) throw new Error('Profile style import missing');
          if (!styles.includes('${profileStyles()}')) throw new Error('Profile style insertion point missing');
          for (const marker of ['PROFILE_HOME_V3_POLISH_1','PROFILE_HOME_V3_POLISH_2','PROFILE_SHEET_VIEWPORT_FIX']) {
            if (!profileSource.includes(marker)) throw new Error('Missing profile style marker: ' + marker);
          }
          NODE

      - name: Compare style and every registered Studio page
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/phase4d-profile-baseline.json', 'utf8'));
          const styles = await import(pathToFileURL('studio/ui-styles.js').href + '?after=' + Date.now());
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const { TEXT, OS_PATHS } = await import(pathToFileURL('studio/config.js').href + '?after=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?after=' + Date.now());
          const ipInfo = { ip: '203.0.113.77', country: 'CN', region: 'Jiangsu', city: 'Suzhou' };
          if (styles.osStyles() !== baseline.styles) throw new Error('osStyles output changed');
          for (const locale of ['en','zh']) {
            for (const route of Array.from(OS_PATHS).sort()) {
              const current = shell.osPage(TEXT[locale], buildLinks(locale, route), route, ipInfo, '@cached-user');
              if (current !== baseline.pages[locale + ':' + route]) throw new Error('Page changed: ' + locale + ':' + route);
            }
          }
          console.log('osStyles and every registered Studio page in EN/ZH are byte-identical.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir /tmp/wrangler-phase4d-profile

      - name: Commit Phase 4D Profile styles and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase4d-profile-styles.mjs
          rm -f .github/workflows/apply-studio-phase4d-profile-styles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A studio scripts/apply-studio-phase4d-profile-styles.mjs .github/workflows/apply-studio-phase4d-profile-styles.yml
          git diff --cached --check
          git commit -m "refactor(studio): extract Profile style fragment"
          git push
