name: Export isolated audit snapshot
on:
  push:
    branches: [audit/p0-p1-stability-20261113]
    paths: ['.github/workflows/audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'qssedalto/qssed.studio' && github.ref == 'refs/heads/audit/p0-p1-stability-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source and comparison
        run: |
          mkdir -p /tmp/audit-snapshot
          git archive --format=tar.gz HEAD -o /tmp/audit-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/audit-snapshot/commit.txt
          git archive --format=tar.gz origin/main -o /tmp/audit-snapshot/main.tar.gz
          git rev-parse origin/main > /tmp/audit-snapshot/main-commit.txt
          git diff origin/main HEAD > /tmp/audit-snapshot/changes.patch
          git diff --stat origin/main HEAD > /tmp/audit-snapshot/changes.txt
          git log --oneline origin/main..HEAD > /tmp/audit-snapshot/commits.txt
      - uses: actions/upload-artifact@v6
        with:
          name: p0-p1-final-source-${{ github.sha }}
          path: /tmp/audit-snapshot/
          retention-days: 1
