name: Apply Studio Phase 3D Content Extraction

on:
  push:
    branches:
      - refactor/studio-phase3-content
    paths:
      - scripts/apply-studio-phase3-content.mjs
      - .github/workflows/apply-studio-phase3-content.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture content baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const routes = [
            '/dashboard',
            '/info','/info/knowledge','/info/links','/info/notes','/info/summaries','/info/search',
            '/workspace','/workspace/workbench','/workspace/projects','/workspace/experiments','/workspace/drafts','/workspace/tasks',
            '/profile','/admin','/settings'
          ];
          const snapshot = {};
          for (const zh of [false, true]) {
            const copy = shell.buildOsCopy(zh);
            for (const route of routes) snapshot[(zh ? 'zh:' : 'en:') + route] = shell.renderOsContent(route, copy);
          }
          fs.writeFileSync('/tmp/content-baseline.json', JSON.stringify(snapshot));
          NODE

      - name: Apply guarded content extraction
        run: node scripts/apply-studio-phase3-content.mjs

      - name: Validate Studio JavaScript
        run: for file in studio/*.js; do node --check "$file"; done

      - name: Verify content ownership boundaries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const shell = fs.readFileSync('studio/ui-shell.js', 'utf8');
          const dashboard = fs.readFileSync('studio/ui-dashboard.js', 'utf8');
          const info = fs.readFileSync('studio/ui-information.js', 'utf8');
          const workspace = fs.readFileSync('studio/ui-workspace.js', 'utf8');
          for (const name of ['dashboardIcon','dashboardContent']) {
            if (!dashboard.includes('function ' + name)) throw new Error(name + ' missing from ui-dashboard.js');
            if (shell.includes('function ' + name)) throw new Error(name + ' remained in ui-shell.js');
          }
          for (const name of ['linksContent','notesContent','summariesContent','searchContent','informationContent']) {
            if (!info.includes('function ' + name)) throw new Error(name + ' missing from ui-information.js');
          }
          if (!workspace.includes('function workspaceContent')) throw new Error('workspaceContent missing from ui-workspace.js');
          for (const marker of ['export function statusContent','export function osHubIcon','export function profileHubContent','export function adminHubContent','export function settingsHubContent','async function hydrateOsUser()']) {
            if (!shell.includes(marker)) throw new Error('Shell-owned marker lost: ' + marker);
          }
          if (!shell.includes('informationContent(path, zh, statusContent)')) throw new Error('Information dispatcher is not wired through shared statusContent');
          if (!shell.includes('workspaceContent(path, zh, statusContent)')) throw new Error('Workspace dispatcher is not wired through shared statusContent');
          NODE

      - name: Compare content route behavior
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/content-baseline.json', 'utf8'));
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const routes = [
            '/dashboard',
            '/info','/info/knowledge','/info/links','/info/notes','/info/summaries','/info/search',
            '/workspace','/workspace/workbench','/workspace/projects','/workspace/experiments','/workspace/drafts','/workspace/tasks',
            '/profile','/admin','/settings'
          ];
          for (const zh of [false, true]) {
            const copy = shell.buildOsCopy(zh);
            for (const route of routes) {
              const key = (zh ? 'zh:' : 'en:') + route;
              const current = shell.renderOsContent(route, copy);
              if (current !== baseline[key]) throw new Error('Rendered content changed: ' + key);
            }
          }
          console.log('Dashboard, Information, Workspace and representative unrelated routes are byte-identical.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-content-dry-run

      - name: Commit content extraction and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase3-content.mjs
          rm -f .github/workflows/apply-studio-phase3-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/ui-dashboard.js studio/ui-information.js studio/ui-workspace.js studio/ui-shell.js scripts/apply-studio-phase3-content.mjs .github/workflows/apply-studio-phase3-content.yml
          git diff --cached --check
          git commit -m "refactor(studio): extract Phase 3D content domains"
          git push
