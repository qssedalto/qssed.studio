name: Import verified P0 P1 audit patch
on:
  push:
    branches: [audit/p0-p1-stability-20261113]
    paths: ['.audit-transfer/current.json', '.github/workflows/audit-import.yml']
permissions:
  contents: write
jobs:
  import-and-test:
    if: github.repository == 'qssedalto/qssed.studio' && github.ref == 'refs/heads/audit/p0-p1-stability-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Apply hash-verified source batch
        run: |
          python3 <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          root=pathlib.Path.cwd()
          manifest=json.loads((root/'.audit-transfer/current.json').read_text())
          assert re.fullmatch(r'batch[0-9]{2}',manifest['batch'])
          assert type(manifest['parts']) is int and 1 <= manifest['parts'] <= 16
          assert re.fullmatch(r'[a-f0-9]{64}',manifest['sha256'])
          text=''.join((root/f".audit-transfer/{manifest['batch']}-{i}.b64").read_text() for i in range(manifest['parts']))
          assert len(text)<2000000
          payload=gzip.decompress(base64.b64decode(text,validate=True))
          digest=lambda x: hashlib.sha256(x).hexdigest()
          assert digest(payload)==manifest['sha256']
          data=json.loads(payload)
          paths=[]
          for change in data['changes']:
              relative=pathlib.PurePosixPath(change['p'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ('studio','scripts','tex-vendor','docs') or str(relative) in ('wrangler.jsonc','auth-browser-refresh.js')
              target=root/relative
              assert not target.is_symlink() and target.resolve().is_relative_to(root)
              old=target.read_bytes() if target.exists() else None
              assert (digest(old) if old is not None else None)==change['o'],str(relative)+' base mismatch'
              if 'c' in change:
                  updated=change['c']
              else:
                  updated=old.decode('utf-8')
                  for start,end,replacement in reversed(change['e']):
                      updated=updated[:start]+replacement+updated[end:]
              encoded=updated.encode('utf-8')
              assert digest(encoded)==change['n'],str(relative)+' result mismatch'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(encoded)
              paths.append(str(relative))
          subprocess.run(['git','add','--',*paths],check=True)
          print('Verified and staged',len(paths),'source files')
          PY
      - name: Commit only to isolated audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete atomic source saves and responsive runtime guards'
          git push origin HEAD:refs/heads/audit/p0-p1-stability-20261113
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build pinned browser and server modules
        run: |
          npm ci --prefix tex-vendor --no-audit --no-fund
          node tex-vendor/build.mjs
      - name: Install fonts for readable Chinese visual evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Execute regressions and full-page browser verification
        shell: bash
        run: |
          mkdir -p /tmp/p0-p1-results
          failed=0
          for file in scripts/*-check.mjs scripts/tex-compile-toolbar-browser.mjs scripts/tex-file-chat-popup-browser.mjs scripts/tex-workbench-browser.mjs; do
            name=$(basename "$file" .mjs)
            if timeout -k 10 120 node "$file" > "/tmp/p0-p1-results/${name}.log" 2>&1; then
              echo "PASS $file" | tee -a /tmp/p0-p1-results/summary.txt
            else
              echo "FAIL $file" | tee -a /tmp/p0-p1-results/summary.txt
              tail -30 "/tmp/p0-p1-results/${name}.log"
              failed=1
            fi
          done
          cat /tmp/p0-p1-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Bundle Work and Studio without deploying
        if: always()
        run: |
          npx --yes wrangler@4.136.3 deploy -c wrangler.work.jsonc --dry-run --outdir /tmp/p0-p1-work-bundle
          npx --yes wrangler@4.136.3 deploy -c wrangler.jsonc --dry-run --outdir /tmp/p0-p1-studio-bundle
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: p0-p1-import-results-${{ github.run_id }}
          path: |
            /tmp/p0-p1-results/
            /tmp/aertex-filechat-visual/*.png
            /tmp/aertex-compile-toolbar-visual/*.png
            /tmp/aertex-workbench-visual/
          if-no-files-found: warn
          retention-days: 7
