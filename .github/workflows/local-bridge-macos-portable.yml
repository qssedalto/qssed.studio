name: Build AERTEX Bridge portable macOS app

on:
  pull_request:
    paths:
      - "local-bridge/macos/**"
      - ".github/workflows/local-bridge-macos-portable.yml"
  push:
    branches: [main]
    paths:
      - "local-bridge/macos/**"
      - ".github/workflows/local-bridge-macos-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    name: Standalone draggable app (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: local-bridge/macos/go.mod
          cache: false

      - name: Verify Go engine and unit tests
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Build universal Bridge binary
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          mkdir -p portable/dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=0.5.6-macos" -o portable/dist/bridge-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=0.5.6-macos" -o portable/dist/bridge-amd64 .
          lipo -create -output portable/dist/AERTEX-Bridge \
            portable/dist/bridge-arm64 portable/dist/bridge-amd64
          lipo -verify_arch arm64 x86_64 portable/dist/AERTEX-Bridge

      - name: Compile self-contained SwiftUI App and branded icon
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          ROOT="portable/AERTEX Bridge.app"
          mkdir -p "$ROOT/Contents/MacOS" "$ROOT/Contents/Resources" portable/icon.iconset
          xcrun swiftc -parse-as-library -framework AppKit -framework SwiftUI \
            -o "$ROOT/Contents/MacOS/AERTEXBridgeManager" \
            packaging/BridgePortableApp.swift
          cp portable/dist/AERTEX-Bridge "$ROOT/Contents/Resources/AERTEX-Bridge"
          chmod 755 "$ROOT/Contents/MacOS/AERTEXBridgeManager" "$ROOT/Contents/Resources/AERTEX-Bridge"
          swift packaging/BridgeIcon.swift portable/dist/BridgeIcon.png
          for n in 16 32 128 256 512; do
            sips -s format png -z "$n" "$n" portable/dist/BridgeIcon.png \
              --out "portable/icon.iconset/icon_${n}x${n}.png" >/dev/null
            doubled=$((n * 2))
            sips -s format png -z "$doubled" "$doubled" portable/dist/BridgeIcon.png \
              --out "portable/icon.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns portable/icon.iconset \
            -o "$ROOT/Contents/Resources/BridgeIcon.icns"
          cat > "$ROOT/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.aertex.bridge.portable</string>
            <key>CFBundleExecutable</key><string>AERTEXBridgeManager</string>
            <key>CFBundleName</key><string>AERTEX Bridge</string>
            <key>CFBundleDisplayName</key><string>AERTEX Bridge</string>
            <key>CFBundleIconFile</key><string>BridgeIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5.6</string>
            <key>CFBundleVersion</key><string>56</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict></plist>
          EOF
          plutil -lint "$ROOT/Contents/Info.plist"

          test -x "$ROOT/Contents/MacOS/AERTEXBridgeManager"
          test -x "$ROOT/Contents/Resources/AERTEX-Bridge"
          lipo -verify_arch arm64 x86_64 "$ROOT/Contents/Resources/AERTEX-Bridge"

      - name: Exercise the embedded Bridge service
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          BINARY="portable/AERTEX Bridge.app/Contents/Resources/AERTEX-Bridge"
          "$BINARY" --background > portable/dist/smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:32145/health > portable/dist/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          grep -q '"version":"0.5.6-macos"' portable/dist/health.json
          grep -q '"runtime":"native-macos"' portable/dist/health.json
          "$BINARY" --status

      - name: Create draggable ZIP and DMG
        working-directory: local-bridge/macos
        run: |
          set -euo pipefail
          ROOT="portable/AERTEX Bridge.app"
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" \
            portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.zip

          mkdir -p portable/dmgroot
          ditto "$ROOT" "portable/dmgroot/AERTEX Bridge.app"
          cp "$ROOT/Contents/Resources/BridgeIcon.icns" portable/dmgroot/.VolumeIcon.icns
          cat > portable/dmgroot/README.txt <<'EOF'
          AERTEX Bridge 0.5.6 — portable macOS app (Apple Silicon + Intel)

          Drag "AERTEX Bridge.app" to ANY location on ANY writable disk.
          No PKG installer. No forced installation on Macintosh HD.

          Double-click the app and click "Start + Login Start".
          This creates only a per-user LaunchAgent in ~/Library/LaunchAgents.
          It requires no sudo password and leaves the background service running after
          the app window closes.

          When you move the app, open it and click Start again to refresh the path.
          Before deleting the app, click Stop + Disable Login.
          MacTeX or TeX Live is required separately for PDF compilation.

          Unsigned and not notarized. A free Apple Development certificate can
          sign a local personal build; it does not enable Developer ID notarization.
          If macOS blocks the app, follow Apple's per-app Open Anyway steps.
          Do not disable Gatekeeper globally.
          EOF
          hdiutil create -volname "AERTEX Bridge Portable" \
            -srcfolder portable/dmgroot -format UDZO -ov \
            portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.dmg
          shasum -a 256 portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.zip \
            portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: aertex-bridge-macos-portable-056
          path: |
            local-bridge/macos/portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.zip
            local-bridge/macos/portable/dist/AERTEX-Bridge-0.5.6-macOS-portable.dmg
          if-no-files-found: error
          retention-days: 30
