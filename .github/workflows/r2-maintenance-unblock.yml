name: Unblock R2 Maintenance Rollout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/r2-maintenance-unblock.yml

permissions:
  contents: read

jobs:
  unblock:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set maintenance marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"unblock":true,"reason":"stop long-running one-shot cleanup","created_at":"2026-09-24T12:18:00Z"}' > /tmp/r2-maintenance-marker.json
          npx --yes wrangler@4.136.3 r2 object put             qsseda-studio-storage/__system/maintenance/r2-audit-security-filter-v1.json             --file /tmp/r2-maintenance-marker.json             --content-type application/json             --remote
