name: Update Studio Phase 3 Completion

on:
  push:
    branches:
      - docs/studio-phase3-complete
    paths:
      - scripts/update-studio-phase3-completion.mjs
      - .github/workflows/update-studio-phase3-completion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update frozen sequencing guide
        run: node scripts/update-studio-phase3-completion.mjs

      - name: Verify documentation state
        run: |
          grep -F '| 3 | Frontend product-domain separation | ✅ Complete — PRs #27–#31 |' docs/STUDIO_WORKER_MODULARIZATION.md
          grep -F '| 4 | Shared UI/runtime cleanup and final consolidation | ⏭️ Next |' docs/STUDIO_WORKER_MODULARIZATION.md
          grep -F '### Phase 3 completion' docs/STUDIO_WORKER_MODULARIZATION.md
          grep -F 'Phase 4 shared-layer audit' docs/STUDIO_WORKER_MODULARIZATION.md

      - name: Commit documentation update and remove one-off files
        run: |
          rm -f scripts/update-studio-phase3-completion.mjs
          rm -f .github/workflows/update-studio-phase3-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STUDIO_WORKER_MODULARIZATION.md scripts/update-studio-phase3-completion.mjs .github/workflows/update-studio-phase3-completion.yml
          git diff --cached --check
          git commit -m "docs(studio): mark Phase 3 complete and Phase 4 next"
          git push
