name: Apply Studio Phase 3E Shell Extraction

on:
  push:
    branches:
      - refactor/studio-phase3-shell
    paths:
      - scripts/apply-studio-phase3-shell.mjs
      - .github/workflows/apply-studio-phase3-shell.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture complete shell baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?before=' + Date.now());
          const { OS_PATHS, TEXT } = await import(pathToFileURL('studio/config.js').href + '?config=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?routing=' + Date.now());
          const snapshot = { content: {}, pages: {} };
          const routes = Array.from(OS_PATHS).sort();
          for (const locale of ['en','zh']) {
            const zh = locale === 'zh';
            const copy = shell.buildOsCopy(zh);
            for (const route of routes) {
              snapshot.content[locale + ':' + route] = shell.renderOsContent(route, copy);
            }
            for (const route of ['/dashboard','/profile','/admin','/settings']) {
              snapshot.pages[locale + ':' + route] = shell.osPage(TEXT[locale], buildLinks(locale, route), route, { ip: '203.0.113.44' }, '@cached-user');
            }
          }
          fs.writeFileSync('/tmp/shell-baseline.json', JSON.stringify(snapshot));
          NODE

      - name: Apply guarded shell extraction
        run: node scripts/apply-studio-phase3-shell.mjs

      - name: Validate Studio JavaScript
        run: for file in studio/*.js; do node --check "$file"; done

      - name: Verify Phase 3 shell boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const shell = fs.readFileSync('studio/ui-shell.js', 'utf8');
          const profile = fs.readFileSync('studio/ui-profile.js', 'utf8');
          const admin = fs.readFileSync('studio/ui-admin.js', 'utf8');
          const settings = fs.readFileSync('studio/ui-settings.js', 'utf8');
          for (const marker of ['export function osPage','export function buildOsCopy','export function buildOsPages','export function renderOsNav','export function renderOsContent','export function statusContent','export function osHubIcon','export function osHubCard','export function osHubGrid','restoreWarmAdminSnapshot','supabaseClient.rpc("is_admin")','async function hydrateOsUser()']) {
            if (!shell.includes(marker)) throw new Error('Shell-owned marker lost: ' + marker);
          }
          for (const marker of ['export function profileHubContent','export function adminHubContent','export function settingsHubContent']) {
            if (shell.includes(marker)) throw new Error('Product Hub remains in shell: ' + marker);
          }
          if (!profile.includes('export function profileHubContent(zh, osHubGrid)')) throw new Error('Profile Hub not owned by ui-profile.js');
          if (!admin.includes('export function adminHubContent(zh, osHubGrid)')) throw new Error('Admin Hub not owned by ui-admin.js');
          if (!settings.includes('export function settingsHubContent(zh, osHubGrid)')) throw new Error('Settings Hub not owned by ui-settings.js');
          if (!settings.includes('export function settingsFallbackContent(zh)')) throw new Error('Settings fallback not owned by ui-settings.js');
          if (!shell.includes('return settingsFallbackContent(zh);')) throw new Error('Settings fallback delegation missing');
          for (const [name, source] of [['profile', profile], ['admin', admin], ['settings', settings]]) {
            if (source.includes('from "./ui-shell.js"')) throw new Error(name + ' module imports ui-shell.js');
          }
          NODE

      - name: Compare all routes and representative complete pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const baseline = JSON.parse(fs.readFileSync('/tmp/shell-baseline.json', 'utf8'));
          const shell = await import(pathToFileURL('studio/ui-shell.js').href + '?after=' + Date.now());
          const { OS_PATHS, TEXT } = await import(pathToFileURL('studio/config.js').href + '?config-after=' + Date.now());
          const { buildLinks } = await import(pathToFileURL('studio/routing.js').href + '?routing-after=' + Date.now());
          const routes = Array.from(OS_PATHS).sort();
          for (const locale of ['en','zh']) {
            const zh = locale === 'zh';
            const copy = shell.buildOsCopy(zh);
            for (const route of routes) {
              const key = locale + ':' + route;
              const current = shell.renderOsContent(route, copy);
              if (current !== baseline.content[key]) throw new Error('Rendered route changed: ' + key);
            }
            for (const route of ['/dashboard','/profile','/admin','/settings']) {
              const key = locale + ':' + route;
              const current = shell.osPage(TEXT[locale], buildLinks(locale, route), route, { ip: '203.0.113.44' }, '@cached-user');
              if (current !== baseline.pages[key]) throw new Error('Complete shell page changed: ' + key);
            }
          }
          console.log('Every registered route and representative complete shell page is byte-identical.');
          NODE

      - name: Bundle Studio Worker
        run: npx --yes wrangler@4 deploy -c wrangler.jsonc --dry-run --outdir .wrangler-shell-dry-run

      - name: Commit Phase 3E extraction and remove one-off files
        run: |
          rm -f scripts/apply-studio-phase3-shell.mjs
          rm -f .github/workflows/apply-studio-phase3-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/ui-shell.js studio/ui-profile.js studio/ui-admin.js studio/ui-settings.js scripts/apply-studio-phase3-shell.mjs .github/workflows/apply-studio-phase3-shell.yml
          git diff --cached --check
          git commit -m "refactor(studio): finish Phase 3 shell composition boundary"
          git push
