name: Refine Auth Consent

on:
  push:
    branches:
      - main
    paths:
      - scripts/refine-auth-consent.mjs

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Auth UI refinement
        run: node scripts/refine-auth-consent.mjs

      - name: Validate Auth JavaScript
        run: |
          node --check auth-oauth.js
          node --check auth-pkce-test.js

      - name: Commit refined UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-oauth.js auth-pkce-test.js
          git commit -m "refactor(auth): simplify user-facing authorization UI"
          git push
