name: Build Native Local Bridge

on:
  pull_request:
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  push:
    branches:
      - main
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: local-bridge/native/go.mod

      - name: Vet native bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build native Windows bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=0.2.0-${GITHUB_SHA::7}" -o dist/QssedA-Local-Bridge.exe .
          test -s dist/QssedA-Local-Bridge.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsseda-local-bridge-windows-amd64
          path: local-bridge/native/dist/QssedA-Local-Bridge.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish bridge binary to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 r2 object put
          qsseda-studio-storage/_system/releases/local-bridge/windows-amd64/QssedA-Local-Bridge.exe
          --file local-bridge/native/dist/QssedA-Local-Bridge.exe
          --remote
