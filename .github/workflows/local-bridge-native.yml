name: Build AERTEX Bridge

on:
  pull_request:
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  push:
    branches:
      - main
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: local-bridge/native/go.mod

      - name: Vet native bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build native Windows bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=0.4.0-${GITHUB_SHA::7}" -o dist/AERTEX-Bridge.exe .
          test -s dist/AERTEX-Bridge.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qsseda-local-bridge-windows-amd64
          path: local-bridge/native/dist/AERTEX-Bridge.exe
          if-no-files-found: error
          retention-days: 30


  smoke-windows:
    name: Verify actual Windows installation and login start
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download native Windows Bridge
        uses: actions/download-artifact@v7
        with:
          name: qsseda-local-bridge-windows-amd64
          path: bridge-smoke

      - name: Install, inspect startup, restart background and verify health
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "bridge-smoke/AERTEX-Bridge.exe").Path
          $installed = Join-Path $env:LOCALAPPDATA "QssedA\LocalBridge\AERTEX-Bridge.exe"
          $log = Join-Path $env:LOCALAPPDATA "QssedA\LocalBridge\bridge.log"
          $runPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $knownPids = @()
          function Read-BridgeHealth {
            return Invoke-RestMethod -Uri "http://127.0.0.1:32145/health" -TimeoutSec 2
          }
          function Wait-Bridge {
            for($i = 0; $i -lt 50; $i++) {
              try {
                $health = Read-BridgeHealth
                if($health.service -eq "qsseda-local-bridge" -and
                   $health.runtime -eq "native-windows" -and
                   $health.version -like "0.4.0-*" -and
                   [int]$health.pid -gt 0) { return $health }
              } catch {}
              Start-Sleep -Milliseconds 180
            }
            throw "Native Bridge health check timed out. Log: $log"
          }
          try {
            $install = Start-Process -FilePath $exe -ArgumentList "--install-silent" -PassThru
            if(-not $install.WaitForExit(25000)) { $install.Kill(); throw "Native installer never returned" }
            if($install.ExitCode -ne 0) {
              if(Test-Path $log) { Get-Content $log -Tail 20 }
              throw "Native installer exited with $($install.ExitCode)"
            }
            if(-not (Test-Path $installed)) { throw "Executable missing after installation" }
            $run = (Get-ItemProperty -Path $runPath -Name "AERTEX Bridge")."AERTEX Bridge"
            if(-not $run.Contains($installed) -or -not $run.Contains("--background")) {
              throw "Incorrect HKCU Run autostart registration: $run"
            }
            $health = Wait-Bridge
            $firstPid = [int]$health.pid
            $knownPids += $firstPid
            if((Get-Process -Id $firstPid -ErrorAction Stop).ProcessName -ne "AERTEX-Bridge") {
              throw "Unexpected process owns Bridge port"
            }
            Write-Host "Installed and verified Bridge PID $firstPid, version $($health.version)"
            Stop-Process -Id $firstPid -Force
            Start-Sleep -Milliseconds 700

            # Simulate the login Run command. The installed binary must run
            # independently after the installing process has exited.
            $background = Start-Process -FilePath $installed -ArgumentList "--background" -PassThru
            $knownPids += $background.Id
            $health = Wait-Bridge
            if([int]$health.pid -eq $firstPid) { throw "Old process unexpectedly survived restart" }
            if(-not (Get-Process -Id ([int]$health.pid) -ErrorAction SilentlyContinue)) {
              throw "Bridge reported health without a running process"
            }
            Write-Host "Verified HKCU background startup PID $($health.pid)"
          } finally {
            foreach($bridgePid in $knownPids) {
              Stop-Process -Id $bridgePid -Force -ErrorAction SilentlyContinue
            }
            Remove-ItemProperty -Path $runPath -Name "AERTEX Bridge" -ErrorAction SilentlyContinue
          }

  publish-windows:
    name: Replace EXE at existing authenticated Work download endpoint
    needs: [build-windows, smoke-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Bridge artifact
        uses: actions/download-artifact@v7
        with:
          name: qsseda-local-bridge-windows-amd64
          path: bridge-release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Replace the existing R2 download object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.136.3 r2 object put
          qsseda-studio-storage/_system/releases/local-bridge/windows-amd64/QssedA-Local-Bridge.exe
          --file bridge-release/AERTEX-Bridge.exe
          --remote
