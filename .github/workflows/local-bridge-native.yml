# 【初学者导读】
# 文件：.github/workflows/local-bridge-native.yml
# GitHub Actions 工作流：定义何时触发检查/构建/部署、各 job 的依赖关系、使用的 secrets 和最终产物/生产目标。
# 阅读顺序：先看 on 触发条件，再看 jobs / needs 依赖，最后逐步检查 checkout、测试、构建、artifact 和部署步骤。
# 修改注意：不要把 secrets 写进仓库；部署步骤的目标 bucket/Worker/域名改变前，应确认 staging/production 边界和 job 条件。
# 初学者提示：配置文件同样是“代码的一部分”，它决定运行环境；出现“本地正常、线上异常”时要优先核对这里。
name: Build AERTEX Bridge

on:
  pull_request:
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  push:
    branches:
      - main
    paths:
      - "local-bridge/native/**"
      - ".github/workflows/local-bridge-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: local-bridge/native/go.mod

      - name: Vet native bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build native Windows bridge
        working-directory: local-bridge/native
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=0.3.0-${GITHUB_SHA::7}" -o dist/AERTEX-Bridge.exe .
          test -s dist/AERTEX-Bridge.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qsseda-local-bridge-windows-amd64
          path: local-bridge/native/dist/AERTEX-Bridge.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish bridge binary to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.136.3 r2 object put
          qsseda-studio-storage/_system/releases/local-bridge/windows-amd64/QssedA-Local-Bridge.exe
          --file local-bridge/native/dist/AERTEX-Bridge.exe
          --remote
