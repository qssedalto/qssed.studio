name: Build AERTEX Original Bridge Installer
on:
  pull_request:
    paths:
      - "local-bridge/original-engine/**"
      - "local-bridge/installer-control/**"
      - "local-bridge/installer/**"
      - ".github/workflows/local-bridge-native.yml"
      - "studio/work-api.js"
  push:
    branches: [main]
    paths:
      - "local-bridge/original-engine/**"
      - "local-bridge/installer-control/**"
      - "local-bridge/installer/**"
      - ".github/workflows/local-bridge-native.yml"
      - "studio/work-api.js"
  workflow_dispatch:
permissions:
  contents: read
env:
  BRIDGE_VERSION: "0.3.2-multipass"
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Verify original and installer control sources
        shell: pwsh
        run: |
          Push-Location local-bridge/original-engine
          try { go vet ./...; if ($LASTEXITCODE -ne 0) { throw 'Original engine vet failed' }; go test ./...; if ($LASTEXITCODE -ne 0) { throw 'Project asset tests failed' } }
          finally { Pop-Location }
          Push-Location local-bridge/installer-control
          try { go vet ./...; if ($LASTEXITCODE -ne 0) { throw 'Controller vet failed' } }
          finally { Pop-Location }
      - name: Compile project-capable native Bridge engine
        shell: pwsh
        run: |
          New-Item -Type Directory -Force local-bridge/dist | Out-Null
          Push-Location local-bridge/original-engine
          try {
            go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$env:BRIDGE_VERSION" -o ../dist/AERTEX-Bridge.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Original engine build failed' }
          } finally { Pop-Location }
          Push-Location local-bridge/installer-control
          try {
            go build -trimpath -ldflags="-s -w -X main.expectedVersion=$env:BRIDGE_VERSION" -o ../dist/AERTEX-Bridge-Control.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Setup controller build failed' }
          } finally { Pop-Location }
      - name: Compile native Windows installer
        shell: pwsh
        run: |
          $root = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $root 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc /Q 'local-bridge/installer/AERTEX-Bridge.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          if (-not (Test-Path 'local-bridge/dist/AERTEX-Bridge-Setup.exe')) { throw 'Missing compiled installer' }
          Get-FileHash 'local-bridge/dist/AERTEX-Bridge-Setup.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: aertex-bridge-setup-win-x64
          path: local-bridge/dist/AERTEX-Bridge-Setup.exe
          if-no-files-found: error
          retention-days: 30

  smoke-windows:
    needs: build-installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aertex-bridge-setup-win-x64
          path: bridge-setup
      - name: Install, verify startup, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'bridge-setup/AERTEX-Bridge-Setup.exe').Path
          $appDir = Join-Path $env:LOCALAPPDATA 'QssedA\LocalBridge'
          $engine = Join-Path $appDir 'AERTEX-Bridge.exe'
          $ctl = Join-Path $appDir 'AERTEX-Bridge-Control.exe'
          $uninstall = Join-Path $appDir 'unins000.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Health {
            $h = Invoke-RestMethod -Uri 'http://127.0.0.1:32145/health' -TimeoutSec 3
            if($h.service -ne 'qsseda-local-bridge' -or $h.protocol -ne 1 -or
               $h.runtime -ne 'native-windows' -or $h.version -ne $env:BRIDGE_VERSION){
              throw 'Wrong Bridge engine on loopback port'
            }
            return $h
          }
          function Setup {
            $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Installer timed out' }
            if ($p.ExitCode -ne 0) {
              $log=Join-Path $appDir 'install.log'
              if(Test-Path $log){Get-Content $log -Tail 25}
              throw "Setup failed with exit $($p.ExitCode)"
            }
          }
          try {
            Setup
            foreach ($file in @($engine,$ctl,$uninstall)) {
              if (-not (Test-Path $file)) { throw "Missing installed file $file" }
            }
            $startup=(Get-ItemProperty -Path $runKey -Name 'AERTEX Bridge' -ErrorAction Stop).'AERTEX Bridge'
            if($startup -ne ('"' + $engine + '" --background')) { throw 'Login autostart missing or incorrect' }
            $h=Health
            & $ctl status $engine
            if($LASTEXITCODE -ne 0){throw 'Installed PID validation failed'}
            $tex=Invoke-RestMethod 'http://127.0.0.1:32145/tex/status'
            if($tex.platform -ne 'win32'){throw 'Original local TeX API is broken'}
            Write-Host 'Original installed engine verified'
            Setup
            $h=Health
            Write-Host 'In-place upgrade verified'
            # Regression: real users had a same-directory predecessor named
            # QssedA-Local-Bridge.exe that continued owning TCP 32145.
            # Simulate that precise legacy image before running the installer.
            & $ctl stop $engine
            if($LASTEXITCODE -ne 0){throw 'Stop engine before legacy test failed'}
            $legacy=Join-Path $appDir 'QssedA-Local-Bridge.exe'
            Copy-Item -LiteralPath $engine -Destination $legacy -Force
            Start-Process -FilePath $legacy -ArgumentList '--background' | Out-Null
            Start-Sleep -Seconds 2
            $h=Health
            $listener=Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 32145 -State Listen -ErrorAction Stop | Select-Object -First 1
            $running=Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)" -ErrorAction Stop
            if($running.ExecutablePath -ine $legacy){throw "Legacy binary did not acquire the listening port: $($running.ExecutablePath)"}
            Setup
            $h=Health
            if(Test-Path $legacy){throw 'Legacy Bridge binary was not retired after upgrade'}
            $listener=Get-NetTCPConnection -LocalAddress '127.0.0.1' -LocalPort 32145 -State Listen -ErrorAction Stop | Select-Object -First 1
            $running=Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)" -ErrorAction Stop
            if($running.ExecutablePath -ine $engine){throw 'The newly installed engine does not own port 32145'}
            Write-Host 'Legacy QssedA-Local-Bridge.exe upgrade verified'
            & $ctl stop $engine
            if($LASTEXITCODE -ne 0){throw 'Stop installed engine failed'}
            Start-Process -FilePath $engine -ArgumentList '--background' | Out-Null
            Start-Sleep -Seconds 2
            $h=Health
            Write-Host 'Windows-login background startup verified'
            $u=Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if(-not $u.WaitForExit(45000)){ $u.Kill(); throw 'Uninstall timed out' }
            if($u.ExitCode -ne 0){throw 'Uninstaller exited with error'}
            if(Test-Path $engine){throw 'Uninstaller left engine on disk'}
            if(Get-ItemProperty -Path $runKey -Name 'AERTEX Bridge' -ErrorAction SilentlyContinue){
              throw 'Uninstaller did not remove login autostart'
            }
            try{ $alive=Invoke-RestMethod 'http://127.0.0.1:32145/health' -TimeoutSec 1 }
            catch{$alive=$null}
            if($alive){throw 'Uninstaller left a running Bridge'}
            Write-Host 'All Windows installer smoke checks passed'
          } finally {
            Get-Process -Name 'AERTEX-Bridge' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path $runKey -Name 'AERTEX Bridge' -ErrorAction SilentlyContinue
          }

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-installer, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aertex-bridge-setup-win-x64
          path: bridge-release
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Replace existing download object with verified setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.136.3 r2 object put
          qsseda-studio-storage/_system/releases/local-bridge/windows-amd64/QssedA-Local-Bridge.exe
          --file bridge-release/AERTEX-Bridge-Setup.exe
          --remote
