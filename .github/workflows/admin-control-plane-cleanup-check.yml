name: Admin Control Plane Cleanup Check

on:
  push:
    branches:
      - admin-control-plane-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Validate cleanup
        run: |
          set -euo pipefail
          node --check admin-worker.js
          for file in admin/*.js; do node --check "$file"; done
          node --check worker.js
          node --check studio/storage-api.js
          node --check studio/ui-storage.js
          node --check studio/summary-api.js
          node --check studio/ui-information.js
          node --check studio/user-links-api.js
          node --check studio/ui-links-workspace.js
          node --check studio/curated-links-user.js
          node --check studio/curated-links-account.js
          node --check studio/global-search-api.js
          node --check studio/tex-api-core.js
          node --check studio/admin-subdomain.js
          node --check scripts/admin-control-plane-check.mjs
          node scripts/admin-control-plane-check.mjs
          node --check scripts/r2-storage-audit-check.mjs
          node scripts/r2-storage-audit-check.mjs
          node --check scripts/global-search-check.mjs
          node scripts/global-search-check.mjs
          node --check scripts/security-markup-check.mjs
          node scripts/security-markup-check.mjs
          node --check scripts/security-architecture-check.mjs
          node scripts/security-architecture-check.mjs
